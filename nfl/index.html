}
// ── bracket rendering ──
const scoreOf = (g, code) => !g.done ? null : (g.real.a === code ? g.real.s1 : g.real.s2);
function brSideHTML(g, code, seed, lab) {
  const sc = scoreOf(g, code);
  // `code` may be null on an undecided slot — never let a placeholder look picked
  const cls = 'brT' + (!code ? '' : g.done && g.realWin === code ? ' realwin' : g.done && g.realWin ? ' lost'
    : !g.done && g.pick === code ? ' pick' : '') + (code && code === follow ? ' fav' : '');
  const tap = code && !g.done ? ` onclick="brPick('${g.key}','${code}')"` : '';
  return `<div class="${cls}"${tap}>
    <span class="sd">${seed || ''}</span>
    ${code ? logoImg(code) : '<span class="brQ">?</span>'}
    <span class="nm${code ? '' : ' ph'}">${code ? teamNick(code) : (lab || t('brTBD'))}</span>
    <span class="sc">${sc != null ? sc : ''}</span></div>`;
}
function brGameHTML(g) {
  const v = g.done && g.pick ? `<span class="brV ${g.pick === g.realWin ? 'ok' : 'no'}">${g.pick === g.realWin ? '✓' : '✗'}</span>` : '';
  return `<div class="brG${g.done ? ' done' : ''}">${v}
    ${brSideHTML(g, g.a, g.aSeed, g.aLab)}${brSideHTML(g, g.b, g.bSeed, g.bLab)}</div>`;
}
function brConfHTML(cf, M) {
  const R = M[cf].rounds;
  const col = (title, games) => `<div class="brCol"><div class="brRh">${title}</div>${games.map(brGameHTML).join('')}</div>`;
  return `<div class="brConf"><h3>${cf}${M[cf].champ ? ` · <b>${teamNick(M[cf].champ)}</b>` : ''}</h3>
    <div class="brRounds">${col(t('brWC'), R[0])}${col(t('brDivR'), R[1])}${col(t('brConfR'), R[2])}</div></div>`;
}
function renderBracketHTML() {
  const M = bracketModel(), sc = predScore();
  const live = MATCHES.some(m => m.st === 3 && m.a);          // is the real field set yet?
  return `<div class="brBar">
      <button onclick="brFill('chalk')" title="${t('brChalkT')}">${t('brChalk')}</button>
      <button onclick="brFill('random')" title="${t('brRandomT')}">${t('brRandom')}</button>
      <button onclick="brShare()">${t('brShare')}</button>
      <button onclick="brReset()" title="${t('brClear')}">↺</button>
      <span class="brScore">${sc.n ? t('brCorrect', sc.ok, sc.n) : M.champion ? t('brPicked', teamNick(M.champion)) : t('brPickem')}</span>
    </div>
    <div class="helpBody">
      ${live ? '' : `<p class="brHint">${t('brProjected')}</p>`}
      ${Object.keys(CONFS).map(cf => brConfHTML(cf, M)).join('')}
      <div class="brSB"><div class="pmT">${META.superBowl || 'SUPER BOWL'} · ${VENUES[matchByN(META.final).v][0]}</div>
        ${brGameHTML(M.sb)}
        ${M.champion ? `<div class="brChamp">🏆 ${teamName(M.champion)}</div>` : ''}</div>
    </div>`;
}
// tab -> [emoji, title, footer note]
const PO_TABS = { picture: ['🏆', 'poTitle', 'poNote', 'poTabPic'],
                  odds:    ['📈', 'odTitle', 'odNote', 'poTabOd'],
                  bracket: ['🔮', 'brTitle', 'brNote', 'poTabBr'] };
let poTab = 'picture';
function poSetTab(v) { poTab = v; renderPO(); }
function renderPO() {
  const cur = PO_TABS[poTab] || PO_TABS.picture;
  const tabs = `<div class="poTabs">${Object.keys(PO_TABS).map(k =>
    `<button class="${poTab === k ? 'on' : ''}" onclick="poSetTab('${k}')">${t(PO_TABS[k][3])}</button>`).join('')}</div>`;
  const body = poTab === 'bracket' ? renderBracketHTML() : poTab === 'odds' ? renderOddsHTML()
    : `<div class="helpBody"><div class="poGrid">${Object.keys(CONFS).map(poConfHTML).join('')}</div></div>`;
  const note = poTab === 'odds' ? t('odNote', liveFit().hfa.toFixed(1)) : t(cur[2]);
  $id('po').firstElementChild.innerHTML =
    `<div class="hh"><h2>${cur[0]} <span class="pc">${t(cur[1])}</span></h2>${tabs}
       <button class="hx" onclick="poClose()" aria-label="${t('tClose')}">✕</button></div>
     ${body}
     <div class="ffNote">${note}</div>`;
}
$id('poBtn').onclick = () => poOn ? poClose() : poOpen();

// ── 📊 fantasy leaders ──────────────────────────────────────────────────────
// Data comes from fantasy.js → fantasy-data.js (window.NFLF): per-week and season
// rows for every offensive player + kicker with points under [Std, Half, PPR], plus
// the raw stat line. Rows are the union of each format's top list, so re-sorting
// here is exact. Headshots straight from ESPN's CDN.
const FF = window.NFLF || null;
const FF_KEY = 'nflviz.ff.v1';
let ffOn = false, ffTab = 'week', ffWeek = null, ffFmt = 2, ffMore = false;
try { const o = JSON.parse(localStorage.getItem(FF_KEY) || '{}'); if (o.fmt >= 0 && o.fmt <= 2) ffFmt = o.fmt; } catch (e) {}
const ffSave = () => { try { localStorage.setItem(FF_KEY, JSON.stringify({ fmt: ffFmt })); } catch (e) {} };
const ffWeeks = () => FF ? FF.weeksDone : [];
const ffHead = id => `https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png`;
function ffOpen() {
  ffOn = true; ffMore = false;
  const ws = ffWeeks(), cur = WEEKS[dayIdx].w;                       // the timeline's week if it has finals, else the latest finished week before it
  ffWeek = ws.includes(cur) ? cur : (ws.filter(w => w <= cur).pop() ?? ws[0] ?? null);
  renderFF(); $id('ff').classList.add('open'); $id('ffBtn').classList.add('on');
}
function ffClose() { ffOn = false; $id('ff').classList.remove('open'); $id('ffBtn').classList.remove('on'); }
function ffTabSet(tab) { ffTab = tab; ffMore = false; renderFF(); }
function ffFmtSet(f) { ffFmt = f; ffSave(); renderFF(); }
function ffStep(d) { const ws = ffWeeks(), i = ws.indexOf(ffWeek) + d; if (i >= 0 && i < ws.length) { ffWeek = ws[i]; ffMore = false; renderFF(); } }
function ffShowMore() { ffMore = true; renderFF(); }
function ffLine(s) {
  const parts = [];
  if (s.py || s.ptd || s.int) parts.push(`${nfmt(s.py)} ${t('ffPass')}${s.ptd ? `, ${s.ptd} TD` : ''}${s.int ? `, ${s.int} INT` : ''}`);
  if (s.ry || s.rtd) parts.push(`${nfmt(s.ry)} ${t('ffRush')}${s.rtd ? `, ${s.rtd} TD` : ''}`);
  if (s.rec || s.recy || s.rectd) parts.push(`${s.rec} ${t('ffRec')}, ${nfmt(s.recy)} ${t('ffYds')}${s.rectd ? `, ${s.rectd} TD` : ''}`);
  if (s.fgm || s.fga || s.xpm) parts.push(`${s.fgm}/${s.fga} FG, ${s.xpm}/${s.xpa} XP`);
  if (s.tp) parts.push(`${s.tp} 2PT`);
  if (s.fl) parts.push(`${s.fl} ${t('ffFum')}`);
  return parts.join(' · ');
}
function renderFF() {
  const card = $id('ff').firstElementChild;
  const fmts = [t('ffStd'), t('ffHalf'), t('ffPpr')];
  const ws = ffWeeks(), wi = ws.indexOf(ffWeek);
  const rows = !FF ? [] : ffTab === 'season' ? FF.seasonTop : (FF.weeks[ffWeek] || []);
  const sorted = rows.slice().sort((a, b) => b.pts[ffFmt] - a.pts[ffFmt]).slice(0, ffMore ? 25 : 10);
  const wkObj = ffWeek != null && WEEKS.find(w => w.w === ffWeek);
  const wkLabel = wkObj ? weekName(wkObj) : '—';
  const list = !FF ? `<div class="scMsg">${t('ffNA')}</div>` : !sorted.length ? `<div class="scMsg">${t('ffEmpty')}</div>`
    : sorted.map((r, i) => `<div class="ffRow${i < 3 ? ' top' : ''}">
        <span class="rk">${i + 1}</span>
        <img class="hs" src="${ffHead(r.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div><div class="nm"><span class="n">${r.n}</span>${TEAMS[r.tm] ? logoImg(r.tm) : ''}<span class="pos">${r.pos || '—'}</span></div>
          <div class="ln">${ffLine(r.st)}${ffTab === 'season' ? ` · ${t('ffGames', r.g)}` : ''}</div></div>
        <div class="pt">${r.pts[ffFmt].toFixed(1)}<small>${ffTab === 'season' && r.g ? t('ffAvg', (r.pts[ffFmt] / r.g).toFixed(1)) : t('ffPts')}</small></div>
      </div>`).join('') + (rows.length > 10 && !ffMore ? `<button class="ffMore" onclick="ffShowMore()">${t('ffMore')}</button>` : '');
  card.innerHTML = `<div class="hh"><h2>📊 <span class="pc">${t('ffTitle')}</span></h2><button class="hx" onclick="ffClose()" aria-label="${t('tClose')}">✕</button></div>
    <div class="ffCtl">
      <div class="ffTabs"><button class="${ffTab === 'week' ? 'on' : ''}" onclick="ffTabSet('week')">${wkLabel}</button><button class="${ffTab === 'season' ? 'on' : ''}" onclick="ffTabSet('season')">${t('ffSeason')}</button></div>
      ${ffTab === 'week' ? `<div class="ffWk"><button onclick="ffStep(-1)" ${wi <= 0 ? 'disabled' : ''} aria-label="${t('tPrev')}">◀</button><button onclick="ffStep(1)" ${wi < 0 || wi >= ws.length - 1 ? 'disabled' : ''} aria-label="${t('tNext')}">▶</button></div>` : ''}
      <div class="ffFmt">${fmts.map((f, i) => `<button class="${ffFmt === i ? 'on' : ''}" onclick="ffFmtSet(${i})">${f}</button>`).join('')}</div>
    </div>
    <div class="helpBody">${list}</div>
    <div class="ffNote">${t('ffNote')}${FF ? ' ' + t('ffUpdated', FF.games) : ''}</div>`;
}
$id('ffBtn').onclick = () => ffOn ? ffClose() : ffOpen();

// ── help / tutorial ────────────────────────────────────────────────────────
let helpOn = false;
const HELP_KEY = 'nflviz.seenHelp.v1';
const IG_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>';
function renderHelp() {
  $id('help').firstElementChild.innerHTML = `
    <div class="hh"><h2><span class="pc">${t('helpTitle')}</span></h2>
      <span class="langPill" title="Language / Idioma">
        <button class="${LANG === 'en' ? 'on' : ''}" onclick="setLang('en')">EN</button>
        <button class="${LANG === 'es' ? 'on' : ''}" onclick="setLang('es')">ES</button>
      </span>
      <button class="hx" onclick="helpClose()" title="${t('tClose')}">✕</button></div>
    <div class="helpBody">${t('helpRows').map(([i, tx]) => `<div class="helpRow"><div class="hi">${i}</div><div class="ht">${tx}</div></div>`).join('')}</div>
    <div class="helpFoot"><a class="igLink" href="http://instagram.com/fractura07" target="_blank" rel="noopener noreferrer">${IG_SVG}${t('igFollow')}</a><button onclick="helpClose()">${t('helpGotIt')}</button></div>`;
}
function helpOpen() { helpOn = true; renderHelp(); $id('help').classList.add('open'); }
function helpClose() { helpOn = false; $id('help').classList.remove('open'); try { localStorage.setItem(HELP_KEY, '1'); } catch (e) {} }
$id('helpBtn').onclick = () => helpOn ? helpClose() : helpOpen();

// ── language switch ─────────────────────────────────────────────────────────
function applyStaticText() {
  try { document.documentElement.lang = LANG; } catch (e) {}
  const hdr = $id('hdr');
  hdr.querySelector('h1').innerHTML = t('h1');
  hdr.querySelector('.sub').innerHTML = t('sub');
  const lbl = $id('follow').querySelector('label'); if (lbl) lbl.textContent = t('followLabel');
  $id('prevBtn').title = t('tPrev'); $id('playBtn').title = t('tPlay'); $id('nextBtn').title = t('tNext');
  $id('helpBtn').title = t('tHelp'); $id('ffBtn').title = t('tFf'); $id('poBtn').title = t('tPo');
  [$id('followClear'), $id('teamFabClear')].forEach(el => { if (el) { el.title = t('clearTeam'); el.setAttribute('aria-label', t('clearTeam')); } });
}
function applyLanguage() {
  applyStaticText();
  rebuildTeamSelect();
  buildDayChips();
  markTeamWeeks();
  setDay(dayIdx, false);
  buildJourney();
  renderStrip();
  renderSound();
  renderNotify();
  if (curDiv && $id('drawer').classList.contains('open')) renderDivision();
  if (helpOn) renderHelp();
  if (ffOn) renderFF();
  if (poOn) renderPO();
}
function setLang(l) {
  if (l === LANG || (l !== 'en' && l !== 'es')) return;
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  MONTHS = MONTHS_T[LANG]; DOW = DOW_T[LANG];
  applyLanguage();
}

// ── go! ──────────────────────────────────────────────────────────────────
applyStaticText();
let _initTeam = (_params.get('team') || '').toUpperCase();
if (!TEAMS[_initTeam] && TEAMS[SAVED.follow]) _initTeam = SAVED.follow;
if (TEAMS[_initTeam]) { sel.value = _initTeam; sel.onchange(); }
$id('fab').onclick = () => $id('panel').classList.toggle('open');
$id('sheetClose').onclick = () => $id('panel').classList.remove('open');
applyFormFactor();
setDay(dayIdx, TEAMS[_initTeam] ? false : undefined);
if (TEAMS[_initTeam]) buildJourney();
renderStrip();
if (_params.get('sheet') === '1') $id('panel').classList.add('open');
const _qdiv = _params.get('div');
if (_qdiv && DIVISIONS[_qdiv]) openDivision(_qdiv);
if (_params.get('play') === '1') startPlay();
if (_params.get('ff') === '1') ffOpen();
const _qpo = _params.get('po');
if (_qpo === 'bracket' || _params.get('b')) { poTab = 'bracket'; poOpen(); }
else if (_qpo === 'odds') { poTab = 'odds'; poOpen(); }
else if (_qpo === '1') poOpen();
let _seenHelp = true; try { _seenHelp = !!localStorage.getItem(HELP_KEY); } catch (e) {}
if (!_seenHelp && !_params.get('div') && !_params.get('play') && !_params.get('ff') && !_qpo && !_params.get('b')) helpOpen();

// ── easter eggs ───────────────────────────────────────────────────────────────
(() => {
  try {
    console.log('%c🏈  NFL 2026 · SEASON MAP',
      'font:700 14px/1.6 system-ui,sans-serif; color:#22e07c; text-shadow:0 1px 0 rgba(0,0,0,.4)');
    console.log('%c285 games · 38 stadiums · 32 teams · one self-contained HTML file.\nbuilt between snaps — poke around. (psst: the ball up top likes attention.)',
      'color:#7d8aa3; font:12px/1.6 monospace');
  } catch (e) {}
})();
let _ballTaps = 0, _ballLast = 0;
document.addEventListener('click', e => {
  if (!e.target.closest || !e.target.closest('#hdr h1 .ball')) return;
  const now = Date.now();
  _ballTaps = (now - _ballLast < 1200) ? _ballTaps + 1 : 1;
  _ballLast = now;
  if (_ballTaps >= 5) { _ballTaps = 0; kickBall(); }
});
function kickBall() {
  if (reduceMotion || document.getElementById('looseBall')) return;
  const b = document.createElement('div');
  b.id = 'looseBall'; b.textContent = '🏈'; b.setAttribute('aria-hidden', 'true');
  b.addEventListener('animationend', () => b.remove());
  document.body.appendChild(b);
}
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>⚽ World Cup 26 — Match Day Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1120; --panel:rgba(13,20,38,.88); --panel-border:rgba(255,255,255,.09);
    --ink:#eef2ff; --ink-dim:#94a3c4; --pitch:#22e07c; --pitch-deep:#0ea35a;
    --gold:#ffd166; --hot:#ff5d8f; --sky:#4cc9f0; --violet:#b388ff; --orange:#ff9f43;
    --live:#ff3b5c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  @supports (height:100dvh){ html,body{height:100dvh;} }
  body{font-family:'Outfit',system-ui,sans-serif; background:var(--bg); color:var(--ink);}
  #map{position:absolute; inset:0; background:#0b1120;}
  .leaflet-container{font:inherit;}

  /* ── header ─────────────────────────────── */
  #hdr{
    position:absolute; top:14px; left:14px; z-index:1000;
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter:blur(12px); border-radius:18px; padding:14px 20px 12px;
    box-shadow:0 8px 32px rgba(0,0,0,.45); width:380px; max-width:calc(100vw - 28px);
  }
  #hdr h1{
    font-size:21px; font-weight:900; letter-spacing:.5px; line-height:1.1;
    background:linear-gradient(92deg,var(--pitch) 0%,var(--sky) 45%,var(--hot) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    display:flex; align-items:center; gap:8px;
  }
  #hdr h1 .ball{font-size:24px; -webkit-text-fill-color:initial; animation:spin 9s linear infinite; display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #hdr .sub{font-size:11.5px; color:var(--ink-dim); margin-top:3px;}
  #dayTitle{font-size:26px; font-weight:800; margin-top:10px; line-height:1;}
  #dayMeta{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .chip{font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);}
  .chip.round{color:#04150c;}

  /* ── live strip ─────────────────────────── */
  #liveStrip{
    margin-top:10px; padding:7px 11px; border-radius:10px; display:none; line-height:1.5;
    background:rgba(255,59,92,.13); border:1px solid rgba(255,59,92,.4);
    font-size:11.5px; font-weight:600; cursor:pointer;
  }
  #liveStrip:hover{filter:brightness(1.2);}
  #liveStrip.next{background:rgba(76,201,240,.1); border-color:rgba(76,201,240,.3);}
  .reddot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--live);
    box-shadow:0 0 8px var(--live); margin-right:6px; animation:blink 1.2s ease infinite;}
  @keyframes blink{50%{opacity:.25}}

  /* ── journey card ───────────────────────── */
  #journey{margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.1); display:none;}
  #journey .jhead{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:800;}
  #journey .jhead img{width:22px; height:15px; border-radius:3px; object-fit:cover;}
  .jstops{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; align-items:center;}
  .jarrow{color:var(--ink-dim); font-size:10px;}
  .jstop{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:8px; cursor:pointer;
    background:rgba(34,224,124,.13); border:1px solid rgba(34,224,124,.4); transition:.12s;
  }
  .jstop.k{background:rgba(255,209,102,.12); border-color:rgba(255,209,102,.45); color:var(--gold);}
  .jstop:hover{transform:translateY(-1px); filter:brightness(1.25);}
  .jmiles{font-size:10.5px; color:var(--ink-dim); margin-top:7px;}
  #roadBtn{
    margin-top:8px; width:100%; padding:6px; border-radius:9px; cursor:pointer; transition:.15s;
    border:1px solid rgba(255,209,102,.5); background:transparent; color:var(--gold);
    font:800 11px 'Outfit',sans-serif; letter-spacing:.4px;
  }
  #roadBtn:hover{background:rgba(255,209,102,.12);}
  #roadBtn.on{background:linear-gradient(135deg,#ffe9a8,var(--gold)); color:#3a2c00;}
  .posSeg{display:flex; gap:5px; margin-top:6px;}
  .posSeg button{
    flex:1; padding:4px; border-radius:8px; border:1px solid var(--panel-border);
    background:#16203a; color:var(--ink-dim); font:700 10px 'Outfit',sans-serif; cursor:pointer;
  }
  .posSeg button.on{border-color:var(--gold); color:var(--gold);}
  .groupLink{cursor:pointer; text-decoration:underline dotted;}
  .groupLink:hover{color:var(--sky);}

  /* ── follow team ────────────────────────── */
  #follow{
    position:absolute; top:14px; right:14px; z-index:1000;
    background:var(--panel); border:1px solid var(--panel-border); backdrop-filter:blur(12px);
    border-radius:14px; padding:10px 14px; box-shadow:0 8px 32px rgba(0,0,0,.45);
    display:flex; align-items:center; gap:8px;
  }
  #follow label{font-size:12px; font-weight:600; color:var(--ink-dim); white-space:nowrap;}
  #follow select{
    background:#16203a; color:var(--ink); border:1px solid var(--panel-border);
    border-radius:9px; padding:6px 8px; font:600 13px 'Outfit',sans-serif; max-width:170px; cursor:pointer;
  }
  #followFlag{width:26px; height:19px; border-radius:3px; object-fit:cover; display:none;
    box-shadow:0 0 0 2px var(--gold);}

  /* ── side panel ─────────────────────────── */
  #panel{
    position:absolute; top:175px; left:14px; bottom:118px; width:380px; z-index:999;
    display:flex; flex-direction:column; pointer-events:none;
  }
  #panelInner{
    pointer-events:auto; overflow-y:auto; padding:4px 6px 12px 0;
    scrollbar-width:thin; scrollbar-color:#33415e transparent;
    mask-image:linear-gradient(#000 92%,transparent);
  }
  .venueHead{display:flex; align-items:center; gap:8px; margin:14px 2px 6px; cursor:pointer;}
  .venueHead:first-child{margin-top:2px;}
  .venueHead .dot{width:10px; height:10px; border-radius:50%; background:var(--pitch); box-shadow:0 0 10px var(--pitch);}
  .venueHead .vn{font-size:13px; font-weight:800; letter-spacing:.3px;}
  .venueHead .vc{font-size:11px; color:var(--ink-dim);}
  .card{
    pointer-events:auto; background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter:blur(10px); border-radius:14px; padding:10px 14px; margin-bottom:8px;
    box-shadow:0 4px 18px rgba(0,0,0,.35); cursor:pointer;
    transition:transform .15s, border-color .15s, box-shadow .15s;
    animation:pop .35s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .noanim .card{animation:none;}
  .card:hover{transform:translateX(4px) scale(1.015); border-color:var(--pitch);}
  .card.followed{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold),0 4px 22px rgba(255,209,102,.25);}
  .card.live{border-color:var(--live); box-shadow:0 0 0 1px var(--live),0 4px 24px rgba(255,59,92,.35);}
  .card.done{opacity:.55;}
  @keyframes pop{from{opacity:0; transform:translateY(14px) scale(.96)}}
  .card .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;}
  .card .ko{font-size:15px; font-weight:800; color:var(--pitch);}
  .card .ko small{font-weight:600; color:var(--ink-dim); font-size:10px; margin-left:4px;}
  .card .mn{font-size:10px; color:var(--ink-dim); font-weight:600;}
  .liveTag{display:inline-flex; align-items:center; font-size:12px; font-weight:900; color:#ff7a90;}
  .ftTag{font-size:10px; font-weight:900; color:var(--ink-dim); background:rgba(255,255,255,.09);
    padding:1px 7px; border-radius:7px; margin-left:6px; vertical-align:2px;}
  .teams{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;}
  .team{display:flex; align-items:center; gap:8px; min-width:0;}
  .team.right{flex-direction:row-reverse; text-align:right;}
  .team img{width:30px; height:21px; border-radius:4px; object-fit:cover; box-shadow:0 1px 5px rgba(0,0,0,.5); flex-shrink:0;}
  .team .tbd{
    width:30px; height:21px; border-radius:4px; flex-shrink:0; display:grid; place-items:center;
    font-size:9px; font-weight:800; background:#222e4d; color:var(--sky); border:1px dashed #3c4f7e;
  }
  .team span{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .vs{font-size:10px; font-weight:800; color:var(--ink-dim);}
  .score{text-align:center; font-size:17px; font-weight:900; color:var(--gold); line-height:1.05; white-space:nowrap;}
  .score small{display:block; font-size:8.5px; color:var(--ink-dim); font-weight:700;}
  .card .your{font-size:10.5px; color:var(--ink-dim); margin-top:6px;}
  #noGames{
    pointer-events:auto; background:var(--panel); border:1px solid var(--panel-border);
    border-radius:14px; padding:18px; text-align:center; color:var(--ink-dim); font-size:14px;
  }

  /* ── group drawer ───────────────────────── */
  #drawer{
    position:absolute; top:80px; bottom:118px; right:-380px; width:340px; z-index:1100;
    background:var(--panel); border:1px solid var(--panel-border); backdrop-filter:blur(14px);
    border-radius:18px; box-shadow:0 12px 40px rgba(0,0,0,.55); overflow:hidden;
    transition:right .28s cubic-bezier(.4,1.4,.6,1); display:flex; flex-direction:column;
  }
  #drawer.open{right:14px;}
  #drawerInner{display:flex; flex-direction:column; min-height:0;}
  .dh{display:flex; justify-content:space-between; align-items:center; padding:14px 16px 10px;}
  .dh h2{font-size:18px; font-weight:900;}
  .dh h2 b{color:var(--pitch);}
  .dx{background:none; border:none; color:var(--ink-dim); font-size:19px; cursor:pointer;}
  .dx:hover{color:var(--ink);}
  .db{overflow-y:auto; padding:0 14px 14px; scrollbar-width:thin; scrollbar-color:#33415e transparent;}
  .gteam{display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:10px; cursor:pointer;}
  .gteam:hover{background:rgba(255,255,255,.07);}
  .gteam img{width:30px; height:21px; border-radius:4px; object-fit:cover;}
  .gteam .fname{font-weight:800; font-size:14px; flex:1;}
  .gteam .fw{font-size:10px; color:var(--gold); font-weight:700; opacity:0; transition:.15s;}
  .gteam:hover .fw{opacity:1;}
  .gteam.followed .fw{opacity:1;}
  .stTbl{width:100%; border-collapse:collapse; font-size:11.5px;}
  .stTbl th{font-size:9px; font-weight:800; color:var(--ink-dim); letter-spacing:.5px; padding:3px 2px; text-align:center;}
  .stTbl th.tl, .stTbl td.tl{text-align:left;}
  .stTbl td{padding:5px 2px; text-align:center; font-weight:700; border-top:1px solid rgba(255,255,255,.06);}
  .stTbl tbody tr{cursor:pointer;}
  .stTbl tbody tr:hover{background:rgba(255,255,255,.07);}
  .stTbl td.tl{font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;}
  .stTbl td.tl img{width:21px; height:14px; border-radius:2.5px; object-fit:cover; vertical-align:-2px; margin-right:5px;}
  .stTbl td.ps{font-weight:900; color:var(--ink-dim); width:18px;}
  .stTbl tr.q td.ps{color:var(--pitch);}
  .stTbl tr.m td.ps{color:var(--orange);}
  .stTbl td.pts{font-weight:900; color:var(--gold);}
  .stTbl tr.fol td{background:rgba(255,209,102,.08);}
  .legend{font-size:9.5px; color:var(--ink-dim); margin:6px 2px 0;}
  .gfix{margin-top:10px; border-top:1px solid rgba(255,255,255,.08); padding-top:8px;}
  .gfixTitle{font-size:10px; font-weight:800; color:var(--ink-dim); letter-spacing:1px; margin:0 6px 4px;}
  .gfx{display:flex; align-items:center; gap:7px; padding:6px; border-radius:9px; cursor:pointer; font-size:12px; font-weight:700;}
  .gfx:hover{background:rgba(255,255,255,.07);}
  .gfx .gd{color:var(--pitch); font-weight:800; min-width:48px; font-size:11px;}
  .gfx img{width:20px; height:14px; border-radius:2.5px; object-fit:cover;}
  .gfx .gv{color:var(--ink-dim); margin-left:auto; font-size:10px; font-weight:600; text-align:right;}

  /* ── timeline ───────────────────────────── */
  #tl{
    position:absolute; left:14px; right:14px; bottom:14px; z-index:1000;
    background:var(--panel); border:1px solid var(--panel-border); backdrop-filter:blur(12px);
    border-radius:18px; padding:10px 12px; box-shadow:0 8px 32px rgba(0,0,0,.45);
    display:flex; align-items:center; gap:10px;
  }
  .tlBtn{
    width:42px; height:42px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    background:linear-gradient(135deg,var(--pitch),var(--pitch-deep)); color:#04150c;
    font-size:17px; display:grid; place-items:center; transition:transform .12s;
    box-shadow:0 4px 14px rgba(34,224,124,.35);
  }
  .tlBtn:hover{transform:scale(1.1);}
  .tlBtn.small{width:34px; height:34px; font-size:13px; background:#222e4d; color:var(--ink); box-shadow:none;}
  .tlBtn.small.on{color:var(--gold); box-shadow:0 0 0 1px var(--gold);}
  #days{display:flex; gap:6px; overflow-x:auto; scroll-behavior:smooth; padding:4px 2px; scrollbar-width:none;}
  #days::-webkit-scrollbar{display:none;}
  .day{
    flex-shrink:0; width:54px; padding:6px 0 5px; border-radius:12px; cursor:pointer;
    text-align:center; border:1px solid transparent; transition:all .15s; position:relative;
    background:rgba(255,255,255,.04);
  }
  .day:hover{background:rgba(255,255,255,.1);}
  .day .dw{font-size:9px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.8px;}
  .day .dn{font-size:18px; font-weight:800; line-height:1.15;}
  .day .dm{font-size:9px; color:var(--ink-dim); font-weight:600;}
  .day .cnt{
    margin:3px auto 0; width:fit-content; min-width:17px; padding:0 4px; border-radius:8px;
    font-size:9.5px; font-weight:800; color:#04150c; line-height:15px;
  }
  .day.active{background:rgba(34,224,124,.16); border-color:var(--pitch); transform:translateY(-2px);}
  .day.active .dn{color:var(--pitch);}
  .day .fdot{position:absolute; top:4px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 6px var(--gold); display:none;}
  .day .today{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    font-size:7.5px; font-weight:900; letter-spacing:.5px; background:var(--hot); color:#fff;
    padding:1.5px 6px; border-radius:6px; box-shadow:0 2px 8px rgba(255,93,143,.5);
  }
  /* following a team: non-match days collapse to slivers */
  #days .day.off{width:15px; opacity:.5;}
  #days .day.off .dw, #days .day.off .dn, #days .day.off .dm,
  #days .day.off .cnt, #days .day.off .today, #days .day.off .fdot{display:none;}
  #days .day.off::after{
    content:''; display:block; width:4px; height:30px; margin:2px auto;
    border-radius:2px; background:rgba(255,255,255,.18);
  }
  #days .day.off.active{opacity:1;}
  #days .day.off.active::after{background:var(--pitch);}

  /* ── clock chip (playback) ──────────────── */
  #clockChip{
    position:absolute; left:50%; bottom:122px; transform:translateX(-50%); z-index:1001;
    background:var(--panel); border:1px solid var(--gold); border-radius:999px;
    padding:8px 18px; display:none; align-items:center; gap:12px; white-space:nowrap;
    font-size:12px; font-weight:700; box-shadow:0 8px 30px rgba(0,0,0,.55);
    backdrop-filter:blur(12px); animation:chipin .25s cubic-bezier(.34,1.56,.64,1);
    max-width:calc(100vw - 60px); overflow:hidden;
  }
  @keyframes chipin{from{opacity:0; transform:translateX(-50%) translateY(10px)}}
  #clockChip .t{color:var(--gold); font-weight:900; font-size:14px;}
  #clockChip img{width:18px; height:12px; border-radius:2px; vertical-align:-1px; object-fit:cover;}
  #clockChip .sep{color:var(--ink-dim);}

  /* ── markers ────────────────────────────── */
  .stadion{position:relative;}
  .stadion .pin{
    position:absolute; inset:0; border-radius:50%; display:grid; place-items:center;
    font:800 14px 'Outfit',sans-serif; color:#04150c; transition:all .2s;
    border:2.5px solid rgba(255,255,255,.85); box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .stadion.live .pin{background:radial-gradient(circle at 30% 30%, #7dffb8, var(--pitch) 60%, var(--pitch-deep));}
  .stadion.live .ring{
    position:absolute; inset:-6px; border-radius:50%; border:2.5px solid var(--pitch);
    animation:pulse 1.8s ease-out infinite;
  }
  .stadion.live .ring.r2{animation-delay:.9s;}
  @keyframes pulse{0%{transform:scale(.7); opacity:.9} 100%{transform:scale(1.7); opacity:0}}
  .stadion.idle .pin{background:#2a3553; color:#7787ab; border-color:rgba(255,255,255,.25); font-size:9px;}
  .stadion.finale .pin{background:radial-gradient(circle at 30% 30%, #ffe9a8, var(--gold) 55%, #e0a93c); animation:bounce 1s ease infinite;}
  .stadion.finale .ring{border-color:var(--gold);}
  @keyframes bounce{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
  .stadion.hot .pin{transform:scale(1.35); border-color:var(--gold); box-shadow:0 0 24px rgba(255,209,102,.8);}
  .stadion.livenow .pin{background:radial-gradient(circle at 30% 30%, #ffb3bd, var(--live) 60%, #b01030); color:#fff;}
  .stadion.livenow .ring{border-color:var(--live);}
  .stadion.fav .pin{
    background:radial-gradient(circle at 30% 30%, #ffe9a8, var(--gold) 55%, #e0a93c);
    border-color:#fff; box-shadow:0 0 22px rgba(255,209,102,.85);
  }
  .stadion.fav .ring{border-color:var(--gold);}
  .stadion.fav .lbl{border-color:var(--gold); color:var(--gold); font-weight:800;}
  .favTag{
    position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:6px;
    display:flex; align-items:center; gap:4px; padding:2px 7px; border-radius:9px;
    background:linear-gradient(135deg,#ffe9a8,var(--gold)); color:#3a2c00;
    font:900 10px 'Outfit',sans-serif; white-space:nowrap;
    box-shadow:0 3px 12px rgba(255,209,102,.55); animation:bob 1.4s ease-in-out infinite;
  }
  .favTag img{width:19px; height:13px; border-radius:2.5px; object-fit:cover; box-shadow:0 1px 3px rgba(0,0,0,.4);}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-5px)}}
  .stadion .lbl{
    position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:7px;
    font:700 10px 'Outfit',sans-serif; color:var(--ink); white-space:nowrap;
    background:rgba(11,17,32,.8); padding:2px 8px; border-radius:8px; backdrop-filter:blur(4px);
    border:1px solid var(--panel-border); pointer-events:none;
  }
  .stadion.idle .lbl{color:#7787ab; opacity:.75;}
  .stopBadge{
    font:800 9.5px 'Outfit',sans-serif; background:rgba(34,224,124,.92); color:#04150c;
    padding:2px 7px; border-radius:8px; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.45);
    width:fit-content;
  }
  .stopBadge.k{background:linear-gradient(135deg,#ffe9a8,var(--gold)); color:#3a2c00;}
  .ballIcon{font-size:17px; filter:drop-shadow(0 2px 5px rgba(0,0,0,.65)); animation:spin 2.2s linear infinite;}

  /* ── popup ──────────────────────────────── */
  .leaflet-popup-content-wrapper{
    background:var(--panel); color:var(--ink); border-radius:14px;
    border:1px solid var(--panel-border); backdrop-filter:blur(12px);
    box-shadow:0 10px 36px rgba(0,0,0,.55);
  }
  .leaflet-popup-tip{background:#16203a;}
  .leaflet-popup-content{margin:13px 16px; font:inherit; min-width:230px;}
  .pp h3{font-size:15px; font-weight:800;}
  .pp .ppc{font-size:11px; color:var(--ink-dim); margin:1px 0 8px;}
  .pp .ppm{display:flex; align-items:center; gap:7px; padding:5px 0; border-top:1px solid rgba(255,255,255,.07); font-size:12.5px; font-weight:600;}
  .pp .ppm img{width:22px; height:15px; border-radius:3px; object-fit:cover;}
  .pp .ppm .t{color:var(--pitch); font-weight:800; min-width:62px;}
  .pp .next{font-size:12px; color:var(--ink-dim); padding-top:6px; border-top:1px solid rgba(255,255,255,.07);}
  .leaflet-popup-close-button{color:var(--ink-dim) !important;}
  .leaflet-control-attribution{background:rgba(11,17,32,.7) !important; color:#5a6a8d !important;}
  .leaflet-control-attribution a{color:#7787ab !important;}

  /* ── bracket predictor ──────────────────────────── */
  #bracket{position:absolute; inset:0; z-index:1600; display:none; background:rgba(7,11,22,.86); backdrop-filter:blur(6px); padding:18px;}
  #bracket.open{display:flex; justify-content:center; align-items:flex-start;}
  #bracketInner{
    width:min(1120px,96vw); max-height:calc(100vh - 36px); position:relative;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.6); display:flex; flex-direction:column; overflow:hidden;
  }
  .brkHead{display:flex; align-items:center; gap:9px; padding:13px 16px; border-bottom:1px solid var(--panel-border); flex-wrap:wrap;}

  .brkScore{font-size:12px; font-weight:800; color:var(--ink-dim); background:rgba(255,255,255,.06); padding:4px 11px; border-radius:999px; white-space:nowrap;}

  .brkTabs{display:flex; gap:4px; margin-left:auto;}
  .brkTabs button{padding:6px 14px; border-radius:999px; border:1px solid var(--panel-border); background:#16203a; color:var(--ink-dim); font:800 12px 'Outfit',sans-serif; cursor:pointer;}
  .brkTabs button.on{background:linear-gradient(135deg,var(--pitch),var(--pitch-deep)); color:#04150c; border-color:transparent;}
  .brkAct{display:flex; gap:6px;}
  .brkAct button{padding:6px 11px; border-radius:9px; border:1px solid var(--panel-border); background:#16203a; color:var(--ink); font:700 12px 'Outfit',sans-serif; cursor:pointer; white-space:nowrap;}
  .brkAct button:hover{filter:brightness(1.25);}
  .brkAct .x{font-size:15px; padding:6px 11px;}
  .brkBody{overflow:auto; padding:14px 16px 20px; scrollbar-width:thin; scrollbar-color:#33415e transparent;}
  .brkHint{font-size:11.5px; color:var(--ink-dim); margin:0 0 12px; line-height:1.5;}
  .brkHint b{color:var(--ink);}
  /* groups */
  .grpGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:11px;}
  .grpCard{background:rgba(255,255,255,.03); border:1px solid var(--panel-border); border-radius:14px; padding:10px 11px;}
  .grpCard h3{font-size:13px; font-weight:900; margin-bottom:7px; display:flex; align-items:center; gap:6px;}
  .lkTag{font-size:8.5px; font-weight:800; border-radius:6px; padding:1px 6px; margin-left:auto; letter-spacing:.5px;}
  .lkTag.fin{color:var(--gold); border:1px solid var(--gold);}
  .lkTag.pick{color:var(--pitch); border:1px solid var(--pitch);}
  .lkTag.live{color:var(--sky); border:1px solid var(--sky);}
  .grpRow{display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:9px; font-size:13px; font-weight:700; background:rgba(255,255,255,.02);}
  .grpRow + .grpRow{margin-top:3px;}
  .grpRow .rk{width:14px; font-weight:900; color:var(--ink-dim); font-size:12px; text-align:center;}
  .grpRow img{width:24px; height:16px; border-radius:3px; object-fit:cover;}
  .grpRow .gn{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .grpRow.q{background:rgba(34,224,124,.1);} .grpRow.q .rk{color:var(--pitch);}
  .grpRow.wc{background:rgba(255,159,67,.1);} .grpRow.wc .rk{color:var(--orange);}
  .grpRow .vb{font-size:11px; font-weight:900;}
  .grpRow .vb.ok{color:var(--pitch);} .grpRow .vb.no{color:var(--live);}
  .grpRow .mv{display:flex; flex-direction:column; gap:2px;}
  .grpRow .mv button{width:21px; height:13px; line-height:11px; border:none; border-radius:4px; background:#283455; color:var(--ink); font-size:9px; cursor:pointer; padding:0;}
  .grpRow .mv button:hover:not(:disabled){background:var(--pitch); color:#04150c;}
  .grpRow .mv button:disabled{opacity:.22; cursor:default;}
  .grpRow.locked .mv{display:none;}
  /* knockout columns */
  .koWrap{display:flex; gap:13px; overflow-x:auto; padding-bottom:8px; align-items:flex-start; scrollbar-width:thin; scrollbar-color:#33415e transparent;}
  .koCol{flex:0 0 auto; width:172px; display:flex; flex-direction:column; gap:9px;}
  .koCol h4{font-size:10.5px; font-weight:900; letter-spacing:1px; color:var(--ink-dim); text-transform:uppercase; margin-bottom:1px;}
  .koMatch{background:rgba(255,255,255,.03); border:1px solid var(--panel-border); border-radius:11px; padding:7px;}
  .koMatch.decided{opacity:.94;}
  .koMn{font-size:9px; font-weight:700; color:var(--ink-dim); margin-bottom:5px; display:flex; align-items:center; gap:5px;}
  .koSc{color:var(--gold); font-weight:900;}
  .koSlot{display:flex; align-items:center; gap:7px; padding:6px 7px; border-radius:8px; font-size:12.5px; font-weight:800; background:rgba(255,255,255,.04); border:1px solid transparent;}
  .koSlot + .koSlot{margin-top:4px;}

  .koSlot[data-pick]{cursor:pointer;}

  .koSlot.win{background:linear-gradient(135deg,rgba(34,224,124,.24),rgba(34,224,124,.06)); border-color:var(--pitch);}
  .koSlot.realwin{background:linear-gradient(135deg,rgba(255,209,102,.26),rgba(255,209,102,.05)); border-color:var(--gold);}
  .koSlot.third{cursor:pointer;} .koSlot.third:hover{border-color:var(--orange);}
  .koSlot .ph{color:var(--ink-dim); font-weight:600; font-size:11px;}

  .vbadge{margin-left:auto; font-weight:900; font-size:12px;}
  .vbadge.ok{color:var(--pitch);} .vbadge.no{color:var(--live);}
  .brkToast{position:absolute; bottom:22px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#ffe9a8,var(--gold)); color:#3a2c00; font:800 12px 'Outfit',sans-serif; padding:9px 16px; border-radius:999px; box-shadow:0 8px 28px rgba(0,0,0,.5); animation:chipin .2s ease;}

  /* ── help / tutorial ────────────────────────────── */
  #help{position:absolute; inset:0; z-index:1650; display:none; background:rgba(7,11,22,.86); backdrop-filter:blur(6px); padding:18px;}
  #help.open{display:flex; justify-content:center; align-items:center;}
  .helpCard{
    width:min(560px,94vw); max-height:calc(100vh - 40px); position:relative;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:18px;

  .helpCard .hh{display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--panel-border);}
  .helpCard .hh h2{font-size:17px; font-weight:900;}
  .helpCard .hh h2 .pc{background:linear-gradient(92deg,var(--pitch),var(--sky) 55%,var(--hot)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .helpCard .hx{margin-left:auto; background:none; border:none; color:var(--ink-dim); font-size:18px; cursor:pointer;}
  .helpCard .hx:hover{color:var(--ink);}
  .helpBody{overflow-y:auto; padding:4px 18px 8px; scrollbar-width:thin; scrollbar-color:#33415e transparent;}
  .helpRow{display:flex; gap:12px; padding:11px 4px; border-bottom:1px solid rgba(255,255,255,.05); align-items:flex-start;}
  .helpRow:last-child{border-bottom:none;}
  .helpRow .hi{font-size:19px; flex-shrink:0; width:26px; text-align:center;}
  .helpRow .ht{font-size:13px; line-height:1.5; color:var(--ink-dim);}
  .helpRow .ht b{font-weight:800; color:var(--ink);}
  .helpRow .ht .k{font:700 10.5px ui-monospace,monospace; background:rgba(255,255,255,.1); border:1px solid var(--panel-border); border-radius:5px; padding:1px 6px; color:var(--ink); white-space:nowrap;}
  .helpFoot{padding:11px 18px; border-top:1px solid var(--panel-border); display:flex; justify-content:flex-end;}
  .helpFoot button{padding:9px 22px; border-radius:10px; border:none; cursor:pointer; font:800 13px 'Outfit',sans-serif; background:linear-gradient(135deg,var(--pitch),var(--pitch-deep)); color:#04150c;}
  .helpFoot button:hover{filter:brightness(1.1);}
  @media (max-width:760px){
    #help{padding:0;}

  }

  #confetti{position:absolute; inset:0; z-index:1500; pointer-events:none;}

  #sheetBar{display:none;}
  #fabRow{display:none;}

  @media (max-width: 760px){
    /* compact header */
    #hdr{top:8px; left:8px; right:8px; width:auto; max-width:none; padding:10px 14px 9px; border-radius:14px;}
    #hdr h1{font-size:14.5px; gap:6px;}
    #hdr h1 .ball{font-size:16px;}
    #hdr .sub{display:none;}
    #dayTitle{font-size:18px; margin-top:6px;}
    #dayMeta{margin-top:6px; gap:4px;}
    .chip{font-size:10px; padding:2px 8px;}
    #liveStrip{font-size:10.5px; padding:6px 9px; margin-top:8px;}
    #journey .jhead{font-size:11.5px;}
    .jstop{font-size:9.5px;}
    .jmiles{font-size:9.5px;}
    #roadBtn{font-size:10px; padding:5px;}

    /* follow picker hides behind the flag button in the FAB row */
    #follow{display:none;}

    /* match list becomes a swipe-up bottom sheet */
    #panel{
      left:8px; right:8px; width:auto; top:auto !important;
      bottom:calc(72px + env(safe-area-inset-bottom));
      max-height:46vh; z-index:1050; pointer-events:auto;
      background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
      backdrop-filter:blur(14px); box-shadow:0 -8px 32px rgba(0,0,0,.5);
      padding:14px 10px 10px;
      transform:translateY(calc(100% + 140px));
      transition:transform .32s cubic-bezier(.4,1.2,.6,1);
    }
    #panel.open{transform:none;}
    #panel::before{
      content:''; position:absolute; top:6px; left:50%; transform:translateX(-50%);
      width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,.25);
    }
    #sheetBar{display:flex; align-items:center; gap:8px; padding:0 4px 7px;}
    #sheetTitle{flex:1; font-size:12.5px; font-weight:800;}
    #sheetClose{flex-shrink:0; width:30px; height:30px; border-radius:50%; border:1px solid var(--panel-border);
      background:#16203a; color:var(--ink-dim); font-size:14px; line-height:1; cursor:pointer; display:grid; place-items:center;}
    #sheetClose:active{background:#22304f; color:var(--ink);}
    #panelInner{mask-image:none; padding-right:2px;}

    #fabRow{
      display:flex; align-items:center; gap:8px; position:absolute;
      right:10px; bottom:calc(78px + env(safe-area-inset-bottom)); z-index:1049;
    }
    #fab{
      display:flex; align-items:center; gap:6px;
      border:none; border-radius:999px; padding:10px 16px; cursor:pointer;
      background:linear-gradient(135deg,var(--pitch),var(--pitch-deep)); color:#04150c;
      font:900 13px 'Outfit',sans-serif; box-shadow:0 6px 20px rgba(34,224,124,.45);
    }
    #teamFab{
      position:relative; width:48px; height:37px; border-radius:999px;
      background:var(--panel); border:1.5px solid rgba(255,255,255,.3);
      display:grid; place-items:center; backdrop-filter:blur(8px);
      box-shadow:0 6px 20px rgba(0,0,0,.45);
    }
    #teamFab.on{border-color:var(--gold); box-shadow:0 0 16px rgba(255,209,102,.55);}
    #teamFabFace{font-size:16px; line-height:1;}
    #teamFabFace img{width:27px; height:19px; border-radius:3px; display:block; object-fit:cover;}
    #teamFab select{position:absolute; inset:0; width:100%; height:100%; opacity:0; font-size:16px;}

    /* compact timeline */
    #tl{left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); padding:8px; gap:7px; border-radius:14px;}
    .tlBtn{width:36px; height:36px; font-size:14px;}
    .tlBtn.small{width:28px; height:28px; font-size:11px;}
    .day{width:46px;}
    .day .dn{font-size:15px;}

    #clockChip{bottom:calc(80px + env(safe-area-inset-bottom)); font-size:10.5px; padding:6px 12px; gap:8px; max-width:calc(100vw - 20px);}

    /* group drawer rises from the bottom */
    #drawer{
      left:8px; right:8px; width:auto; top:auto; bottom:0; max-height:62vh;
      border-radius:18px 18px 0 0;
      transform:translateY(110%); transition:transform .3s cubic-bezier(.4,1.2,.6,1);
    }
    #drawer.open{transform:none; right:8px;}

    .leaflet-control-zoom{display:none;}
    .stadion .lbl{font-size:9px;}

    #bracket{padding:0;}
    #bracketInner{width:100vw; max-height:100vh; height:100%; border-radius:0;}
    .brkHead{padding:9px 11px; gap:7px;}
    .brkHead h2{font-size:14px;}
    .brkScore{font-size:11px; padding:3px 9px;}
    .brkTabs{order:5; width:100%; margin-top:5px;}
    .brkTabs button{flex:1;}
    .grpGrid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="confetti"></canvas>

<div id="hdr">
  <h1><span class="ball">⚽</span> WORLD CUP 26 · MATCH DAY MAP</h1>
  <div class="sub">Canada · Mexico · United States &nbsp;|&nbsp; June 11 – July 19, 2026</div>
  <div id="dayTitle"></div>
  <div id="dayMeta"></div>
  <div id="liveStrip"></div>
  <div id="journey"></div>
</div>

<div id="follow">
  <img id="followFlag" alt="">
  <label for="teamSel">⭐ Follow:</label>
  <select id="teamSel"><option value="">— pick a team —</option></select>
</div>

<div id="panel">
  <div id="sheetBar"><div id="sheetTitle"></div><button id="sheetClose" title="Close" aria-label="Close match list">✕</button></div>
  <div id="panelInner"></div>
</div>
<div id="fabRow">
  <button id="fab">📋</button>
  <div id="teamFab" title="Follow a team"><span id="teamFabFace">⭐</span></div>
</div>
<div id="drawer"><div id="drawerInner"></div></div>
<div id="bracket"><div id="bracketInner"></div></div>
<div id="help"><div class="helpCard"></div></div>
<div id="clockChip"></div>

<div id="tl">
  <button class="tlBtn small" id="prevBtn" title="Previous day (←)">◀</button>
  <button class="tlBtn" id="playBtn" title="Play the tournament (space)">▶</button>
  <button class="tlBtn small" id="nextBtn" title="Next day (→)">▶</button>
  <button class="tlBtn small" id="soundBtn" title="Goal sounds">🔇</button>
  <button class="tlBtn small" id="predBtn" title="Bracket predictor">🔮</button>
  <button class="tlBtn small" id="helpBtn" title="How to use this app">?</button>
  <div id="days"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
if (new URLSearchParams(location.search).get('debug') === '1') {
  window.onerror = (msg, src, line, col) => {
    document.body.insertAdjacentHTML('beforeend',
      `<div style="position:fixed;top:4px;left:420px;z-index:99999;background:#c00;color:#fff;font:14px monospace;padding:8px;max-width:700px">${msg} @ ${line}:${col}</div>`);
  };
}
const {teams:TEAMS, venues:VENUES, groups:GROUPS, matches:MATCHES} = window.WC;

const ROUND_COLOR = {
  'Group Stage':'#22e07c','Round of 32':'#4cc9f0','Round of 16':'#b388ff',
  'Quarterfinal':'#ff9f43','Semifinal':'#ff5d8f','Third Place':'#d9a066','Final':'#ffd166'
};
const ROUND_SHORT = {
  'Round of 32':'R32','Round of 16':'R16','Quarterfinal':'QF','Semifinal':'SF','Final':'🏆 FINAL'
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// ── helpers ──────────────────────────────────────────────────────────────
const $id = s => document.getElementById(s);
const dateObj = d => new Date(d + 'T12:00:00');
const fmt12 = t => {
  let [h, m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
};
const kickoffUTC = m => {
  const [y, mo, da] = m.d.split('-').map(Number);
  const [h, mi] = m.t.split(':').map(Number);
  return Date.UTC(y, mo - 1, da, h - m.utc, mi);
};
const yourTime = m => new Date(kickoffUTC(m)).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'});
const flagURL = code => `https://flagcdn.com/w40/${TEAMS[code][1]}.png`;
const cssId = s => s.replace(/[^a-z0-9]/gi, '');
const esc = s => s.replace(/'/g, "\\'");
const mdOf = d => d <= '2026-06-17' ? 1 : d <= '2026-06-23' ? 2 : 3;
const groupOf = code => Object.keys(GROUPS).find(g => GROUPS[g].includes(code));

function teamMeta(t) {
  if (TEAMS[t]) return {code:t, name:TEAMS[t][0], flag:flagURL(t)};
  const p = t.slice(1);
  let badge = '?', label = p, mm;
  if ((mm = p.match(/^W·(\w)$/)))        { badge = '1' + mm[1]; label = `Winner Group ${mm[1]}`; }
  else if ((mm = p.match(/^2nd·(\w)$/))) { badge = '2' + mm[1]; label = `Runner-up Group ${mm[1]}`; }
  else if ((mm = p.match(/^3rd·(.+)$/))) { badge = '3rd'; label = `3rd place ${mm[1]}`; }
  else if ((mm = p.match(/^W Match (\d+)$/))) { badge = 'W' + mm[1]; label = `Winner of Match ${mm[1]}`; }
  else if ((mm = p.match(/^L Match (\d+)$/))) { badge = 'L' + mm[1]; label = `Loser of Match ${mm[1]}`; }
  return {badge, label};
}
function teamHTML(t, right) {
  const tm = teamMeta(t);
  if (tm.code) return `<div class="team${right?' right':''}"><img src="${tm.flag}" alt=""><span>${tm.name}</span></div>`;
  return `<div class="team${right?' right':''}"><span class="tbd">${tm.badge}</span><span style="color:var(--ink-dim)">${tm.label}</span></div>`;
}
const shortHTML = t => {
  const tm = teamMeta(t);
  return tm.code ? `<img src="${tm.flag}" alt=""> ${tm.code}` : tm.badge;
};
function haversineMi(a, b) {
  const R = 3959, rad = x => x * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDur(ms) {
  const t = Math.max(0, Math.round(ms / 60000));
  const d = Math.floor(t / 1440), h = Math.floor(t % 1440 / 60), mi = t % 60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${mi}m` : `${mi}m`;
}
// live state: pre / live / ft  (live window ≈ 2h05 groups, 2h50 knockout w/ ET+pens)
const windowMs = m => (m.r === 'Group Stage' ? 125 : 170) * 60000;
const stateOf = (m, now) => now < kickoffUTC(m) ? 'pre' : now < kickoffUTC(m) + windowMs(m) ? 'live' : 'ft';

// ── day list ─────────────────────────────────────────────────────────────
const byDay = {};
MATCHES.forEach(m => (byDay[m.d] = byDay[m.d] || []).push(m));
const DAYS = Object.keys(byDay).sort();
const _now0 = new Date();
const TODAY = `${_now0.getFullYear()}-${String(_now0.getMonth()+1).padStart(2,'0')}-${String(_now0.getDate()).padStart(2,'0')}`;

function dayLabel(d) {
  const rounds = [...new Set(byDay[d].map(m => m.r))];
  if (rounds.includes('Group Stage')) return [`Group Stage · Matchday ${mdOf(d)}`, 'Group Stage'];
  if (rounds[0] === 'Final') return ['THE FINAL 🏆', 'Final'];
  return [rounds.join(' & '), rounds[0]];
}

// ── map ──────────────────────────────────────────────────────────────────
const map = L.map('map', {zoomControl:false, attributionControl:true, minZoom:3, maxZoom:12})
  .setView([37.5, -97], 4);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a> · Schedule: <a href="https://en.wikipedia.org/wiki/2026_FIFA_World_Cup">Wikipedia</a>',
  subdomains:'abcd', maxZoom:19,
}).addTo(map);

const markers = {};
for (const [name, v] of Object.entries(VENUES)) {
  const mk = L.marker([v[2], v[3]], {icon: L.divIcon({className:'', html:'', iconSize:[40,40], iconAnchor:[20,20]})}).addTo(map);
  mk.on('click', () => openVenue(name));
  markers[name] = mk;
}

function iconFor(name, dayMatches, now) {
  if (journeyVenues && !journeyVenues.has(name))
    return L.divIcon({className:'', html:'', iconSize:[0, 0]});
  const v = VENUES[name];
  const n = dayMatches.length;
  const isFinal = dayMatches.some(m => m.r === 'Final');
  const isFav = follow && dayMatches.some(m => m.a === follow || m.b === follow);
  const liveNow = dayMatches.some(m => stateOf(m, now) === 'live');
  const cls = (n === 0 ? 'idle' : isFinal ? 'finale live' : 'live')
    + (liveNow ? ' livenow' : '') + (isFav ? ' fav' : '');
  const inner = n === 0 ? '·' : isFinal && !liveNow ? '🏆' : n;
  const sz = n === 0 ? 22 : 40;
  const favTag = isFav
    ? `<div class="favTag"><img src="${flagURL(follow)}" alt="">${TEAMS[follow][0].toUpperCase()} PLAYS HERE</div>`
    : '';
  return L.divIcon({
    className:'',
    html:`<div class="stadion ${cls}" id="mk-${cssId(name)}" style="width:${sz}px;height:${sz}px">
      ${n ? '<div class="ring"></div><div class="ring r2"></div>' : ''}
      <div class="pin">${inner}</div>
      ${favTag}
      <div class="lbl">${v[0]}</div></div>`,
    iconSize:[sz, sz], iconAnchor:[sz/2, sz/2],
  });
}

// ── state ────────────────────────────────────────────────────────────────

function setDay(i, fly) {

function hotMarker(id, on) {

function openVenue(name) {

// ── journey arcs + champion's road ───────────────────────────────────────
let journeyLayer = null, ballTimer = null;
let journeyVenues = null;   // while following: the only stadiums shown on the map

function clearJourney() {
  if (journeyLayer) { map.removeLayer(journeyLayer); journeyLayer = null; }
  if (ballTimer) { clearInterval(ballTimer); ballTimer = null; }
}
function arcPoints(a, b) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const cx = mx - dy * 0.22, cy = my + dx * 0.22;
  const pts = [];
  for (let i = 0; i <= 32; i++) {
    const t = i / 32;
    pts.push([(1-t)*(1-t)*a[0] + 2*(1-t)*t*cx + t*t*b[0],
              (1-t)*(1-t)*a[1] + 2*(1-t)*t*cy + t*t*b[1]]);
  }
  return pts;
}
// walk the bracket from a placeholder tag until the Final (or until slots
// have been resolved with real teams and the tag no longer exists)
function chainFromTag(tag) {
  let cur = MATCHES.find(m => m.a === tag || m.b === tag);
  const out = [];
  while (cur && out.length < 6) {
    out.push({v: cur.v, label: ROUND_SHORT[cur.r] || cur.r, d: cur.d});
    if (cur.r === 'Final') break;
    cur = MATCHES.find(m => (m.a === `?W Match ${cur.n}` || m.b === `?W Match ${cur.n}`) && m.r !== 'Third Place');
  }
  return out;
}
// hypothetical remaining path for a team: from group position while in groups,
// from their last actual fixture once knockout slots resolve to real teams
function roadFrom(code, pos, mine) {
  const last = mine[mine.length - 1];
  if (!last || last.r === 'Final' || last.r === 'Third Place') return [];
  if (last.r === 'Group Stage') return chainFromTag(pos === 'W' ? `?W·${groupOf(code)}` : `?2nd·${groupOf(code)}`);
  return chainFromTag(`?W Match ${last.n}`);
}

function buildJourney() {
  clearJourney();
  saveState();   // follow / road toggles all funnel through here
  if (!follow) {
    journeyVenues = null;
    $id('journey').style.display = 'none';
    layoutPanel();
    updateMarkers(DAYS[dayIdx]);
    return;
  }
  const gm = MATCHES.filter(m => m.a === follow || m.b === follow)
    .sort((x, y) => x.d.localeCompare(y.d));
  const stops = gm.map(m => ({
    v: m.v,
    label: m.r === 'Group Stage' ? 'MD' + mdOf(m.d) : (ROUND_SHORT[m.r] || m.r),
    d: m.d, k: m.r !== 'Group Stage', hyp: false,
  }));
  const road = roadOn ? roadFrom(follow, roadPos, gm).map(s => ({...s, k: true, hyp: true})) : [];
  const all = stops.concat(road);
  const merged = [];
  for (const s of all) {
    const p = merged[merged.length - 1];
    if (p && p.v === s.v) p.label += ' · ' + s.label;
    else merged.push({...s});
  }

  journeyLayer = L.layerGroup().addTo(map);
  let miles = 0, kmiles = 0, fullPath = [];
  for (let i = 0; i < merged.length - 1; i++) {
    const A = VENUES[merged[i].v], B = VENUES[merged[i+1].v];
    const pts = arcPoints([A[2], A[3]], [B[2], B[3]]);
    const knock = merged[i+1].k, hyp = merged[i+1].hyp;
    const dmi = haversineMi([A[2], A[3]], [B[2], B[3]]);
    if (hyp) kmiles += dmi; else miles += dmi;
    L.polyline(pts, {color: knock ? '#ffd166' : '#22e07c', weight: 9, opacity: .16, interactive: false}).addTo(journeyLayer);
    L.polyline(pts, {color: knock ? '#ffd166' : '#22e07c', weight: 2.6, opacity: .95,
      dashArray: hyp ? '7 9' : null, interactive: false}).addTo(journeyLayer);
    fullPath = fullPath.concat(pts);
  }
  merged.forEach(s => {
    const V = VENUES[s.v];
    L.marker([V[2], V[3]], {
      icon: L.divIcon({className:'', html:`<div class="stopBadge${s.k?' k':''}">${s.label}</div>`, iconSize:[0,0], iconAnchor:[-13, 27]}),
      interactive: false,
    }).addTo(journeyLayer);
  });
  if (fullPath.length > 1) {
    const ball = L.marker(fullPath[0], {
      icon: L.divIcon({className:'', html:'<div class="ballIcon">⚽</div>', iconSize:[20,20], iconAnchor:[10,10]}),
      interactive: false, zIndexOffset: 3000,
    }).addTo(journeyLayer);
    let idx = 0;
    ballTimer = setInterval(() => { idx = (idx + 1) % fullPath.length; ball.setLatLng(fullPath[idx]); }, 30);
  }
  const inGroups = gm.length && gm[gm.length - 1].r === 'Group Stage';
  journeyVenues = new Set(merged.map(s => s.v));
  updateMarkers(DAYS[dayIdx]);
  renderJourneyCard(stops, road, miles, kmiles, inGroups);
  fitJourney(merged.map(s => s.v));
}

// refit the map so the whole drawn path is visible around the UI chrome
function fitJourney(venueNames) {
  const pts = [...new Set(venueNames)].map(n => [VENUES[n][2], VENUES[n][3]]);
  if (!pts.length) return;

  const mobile = mqMobile.matches;

}

function renderJourneyCard(stops, road, miles, kmiles, inGroups) {

// ── live engine ──────────────────────────────────────────────────────────
function renderStrip() {

setInterval(() => {

  }

// ── live scores: backfill + poll ───────────────────────────────────────────
// Scores live in the static data.js, so on load we backfill EVERY finished
// match from Wikipedia (not just the ones in their live window). The interval
// poller then keeps in-progress games fresh and fires goal confetti.
const PAGE_TITLE = src =>
  src === 'knockout' ? '2026 FIFA World Cup knockout stage' :
  src === 'final' ? '2026 FIFA World Cup final' :
  '2026 FIFA World Cup Group ' + src.slice(-1);

const _wikiCache = {};   // src -> {t, text}; dedupes fetches across backfill + poller
async function fetchSrcPage(src) {
  const c = _wikiCache[src];
  if (c && Date.now() - c.t < 90000) return c.text;
  const url = 'https://en.wikipedia.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main'
    + '&formatversion=2&format=json&origin=*&titles=' + encodeURIComponent(PAGE_TITLE(src));
  const j = await (await fetch(url)).json();
  const text = j.query.pages[0].revisions[0].slots.main.content;
  _wikiCache[src] = {t: Date.now(), text};
  return text;
}

// pull one match's score / a.e.t. / penalties out of a page's wikitext.
// returns true if anything changed; `celebrate` only pops goal confetti for a
// rising score on a live match (so backfilled history stays silent).
function applyWikiScore(m, text, celebrate) {
  const secRe = new RegExp('<section begin="?' + m.sec.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '"? *\\/>([\\s\\S]*?)<section end=');
  const block = (text.match(secRe) || [])[1];
  if (!block) return false;
  const field = f => (block.match(new RegExp('^\\|' + f + '=(.*)$', 'm')) || ['', ''])[1];
  let changed = false;
  const sm = field('score').match(/(\d+)\s*[–—-]\s*(\d+)/);
  if (sm) {
    const n1 = +sm[1], n2 = +sm[2];
    if (n1 !== m.s1 || n2 !== m.s2) {
      if (celebrate && stateOf(m, Date.now()) === 'live' && ((m.s1 != null && n1 > m.s1) || (m.s2 != null && n2 > m.s2))) goalBurst(m.v);
      m.s1 = n1; m.s2 = n2; changed = true;
    }
  }
  if (/^y/i.test(field('aet')) && !m.aet) { m.aet = 1; changed = true; }
  const pm = field('penaltyscore').match(/(\d+)\s*[–—-]\s*(\d+)/);
  if (pm && !m.pens) { m.pens = `${pm[1]}–${pm[2]}`; changed = true; }
  return changed;
}

// re-render everything that shows a score
function refreshViews() {
  renderStrip();
  if (!playing) { updateMarkers(DAYS[dayIdx]); renderPanel(DAYS[dayIdx], byDay[DAYS[dayIdx]], true); }
  if (predOn) renderBracket();
  const dr = $id('drawer');
  if (dr.classList.contains('open')) { const b = dr.querySelector('.dh h2 b'); if (b && GROUPS[b.textContent]) openGroup(b.textContent); }
}

async function pollLiveScores() {
  const now = Date.now();
  const active = MATCHES.filter(m => { const ko = kickoffUTC(m); return now >= ko && now < ko + windowMs(m) + 45 * 60000; });
  if (!active.length) return;
  let changed = false;

// one-time on load: fill in every match that has kicked off but has no score yet
async function backfillScores() {

// ESPN scoreboard: faster live source — real-time score + actual match clock
// (Wikipedia poller above remains authoritative for FT/aet/penalties)
async function pollESPN() {
  const now = Date.now();
  const anyActive = MATCHES.some(m => {
    const ko = kickoffUTC(m);
    return now >= ko - 10 * 60000 && now < ko + windowMs(m) + 45 * 60000;
  });
  if (!anyActive) return;
  try {
    const j = await (await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard')).json();
    let changed = false;
    for (const e of j.events || []) {
      const comp = e.competitions && e.competitions[0];
      const st = e.status && e.status.type ? e.status.type.state : '';
      if (!comp || (st !== 'in' && st !== 'post')) continue;
      const sides = comp.competitors.map(c => ({code: c.team.abbreviation, score: parseInt(c.score, 10)}));
      const evTime = Date.parse(e.date);
      const m = MATCHES.find(x => TEAMS[x.a] && TEAMS[x.b]
        && Math.abs(kickoffUTC(x) - evTime) < 3 * 3600000
        && sides.every(c => c.code === x.a || c.code === x.b));
      if (!m) continue;
      let scored = false;
      for (const c of sides) {
        if (Number.isNaN(c.score)) continue;
        if (c.code === m.a && m.s1 !== c.score) { if (m.s1 != null && c.score > m.s1) scored = true; m.s1 = c.score; changed = true; }
        if (c.code === m.b && m.s2 !== c.score) { if (m.s2 != null && c.score > m.s2) scored = true; m.s2 = c.score; changed = true; }
      }
      if (scored && stateOf(m, now) === 'live') goalBurst(m.v);   // 🎉 goal!
      const clk = st === 'in' ? (e.status.displayClock || null) : null;
      if (m.clock !== clk) { m.clock = clk; changed = true; }
    }
    if (changed) {
      renderStrip();
      if (!playing) {
        updateMarkers(DAYS[dayIdx]);
        renderPanel(DAYS[dayIdx], byDay[DAYS[dayIdx]], true);

  } catch (err) { /* offline or API hiccup — retry next tick */ }
}

// ── group standings (computed from results) ──────────────────────────────
// FIFA criteria approximation: points → head-to-head points/GD/goals among
// tied teams → overall GD → overall goals (fair play + ranking unavailable)
function standingsFor(g, tieRandom) {
  const rows = {};
  GROUPS[g].forEach(c => rows[c] = {c, P:0, W:0, D:0, L:0, GF:0, GA:0, Pts:0});
  // final tiebreaker: alphabetical (stable, for the real standings display) or a
  // fixed per-team random key (so Auto randomises only genuinely-tied teams)
  const rnd = {}; if (tieRandom) GROUPS[g].forEach(c => rnd[c] = Math.random());
  const lastTie = tieRandom
    ? (x, y) => rnd[x.c] - rnd[y.c]
    : (x, y) => TEAMS[x.c][0].localeCompare(TEAMS[y.c][0]);
  const played = MATCHES.filter(m => m.g === g && m.s1 != null);
  for (const m of played) {
    const A = rows[m.a], B = rows[m.b];
    A.P++; B.P++; A.GF += m.s1; A.GA += m.s2; B.GF += m.s2; B.GA += m.s1;
    if (m.s1 > m.s2) { A.W++; B.L++; A.Pts += 3; }
    else if (m.s1 < m.s2) { B.W++; A.L++; B.Pts += 3; }
    else { A.D++; B.D++; A.Pts++; B.Pts++; }
  }
  const list = Object.values(rows);
  list.forEach(r => r.GD = r.GF - r.GA);
  list.sort((x, y) => y.Pts - x.Pts);
  const out = [];
  let i = 0;
  while (i < list.length) {
    let j = i;
    while (j < list.length && list[j].Pts === list[i].Pts) j++;
    const tied = list.slice(i, j);
    if (tied.length > 1) {
      const codes = new Set(tied.map(t => t.c));
      const h2h = {};
      tied.forEach(t => h2h[t.c] = {Pts:0, GD:0, GF:0});
      for (const m of played) {
        if (!codes.has(m.a) || !codes.has(m.b)) continue;
        const A = h2h[m.a], B = h2h[m.b];
        A.GD += m.s1 - m.s2; B.GD += m.s2 - m.s1; A.GF += m.s1; B.GF += m.s2;
        if (m.s1 > m.s2) A.Pts += 3; else if (m.s1 < m.s2) B.Pts += 3; else { A.Pts++; B.Pts++; }
      }
      tied.sort((x, y) =>
        h2h[y.c].Pts - h2h[x.c].Pts || h2h[y.c].GD - h2h[x.c].GD || h2h[y.c].GF - h2h[x.c].GF ||
        y.GD - x.GD || y.GF - x.GF || lastTie(x, y));
    }
    out.push(...tied); i = j;
  }
  return out;
}

// ── goal sound (synthesized via Web Audio — no asset, opt-in) ─────────────
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  } catch (e) { audioCtx = null; }

}
// a short triumphant rising fanfare (G4 → C5 → E5 → G5)
function playGoal() {
  if (!soundOn) return;
  const ac = ensureAudio();
  if (!ac) return;
  const t0 = ac.currentTime + 0.02, notes = [392.00, 523.25, 659.25, 783.99];
  notes.forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f;

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  });
}

// ── confetti ──────────────────────────────────────────────────────────────
// One canvas + one rAF loop drives two effects: a steady fall on the Final day

const cv = $id('confetti'), cx = cv.getContext('2d');

// erupt a burst from a stadium marker (falls back to mid-screen if off-map)
function goalBurst(venueName) {
  playGoal();
  sizeCanvas();
  let ox = cv.width / 2, oy = cv.height * 0.55;
  const V = VENUES[venueName];
  if (V) { try { const pt = map.latLngToContainerPoint([V[2], V[3]]); ox = pt.x; oy = pt.y; } catch (e) {} }
  for (let i = 0; i < 110; i++) {
    const ang = -Math.PI / 2 + (Math.random() - .5) * 2.2;   // mostly upward fan
    const sp = 5 + Math.random() * 9;
    bursts.push({
      x: ox, y: oy, w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      rot: Math.random() * Math.PI, vr: Math.random() * .3 - .15,

function confTick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  if (confOn) {
    for (const p of parts) {
      p.y += p.vy; p.x += p.vx + Math.sin(p.y * .02); p.rot += p.vr;
      if (p.y > cv.height + 20) { p.y = -20; p.x = Math.random() * cv.width; }
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
    }
  }
  if (bursts.length) {
    for (const p of bursts) {
      p.vy += 0.22; p.vx *= 0.99;                 // gravity + a little drag
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.011;
      cx.save(); cx.globalAlpha = Math.max(0, p.life);
      cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
    }
    cx.globalAlpha = 1;
    bursts = bursts.filter(p => p.life > 0 && p.y < cv.height + 40);

}

// ── bracket predictor ─────────────────────────────────────────────────────
// Resolves the whole knockout tree from the user's group orders + winner picks.
// Real (FT) results always win and lock; everything else is the prediction.
const MATCH_BY_N = {}; MATCHES.forEach(m => MATCH_BY_N[m.n] = m);
const matchByN = n => MATCH_BY_N[n];
const KO_MATCHES = MATCHES.filter(m => m.src === 'knockout' || m.src === 'final');
const GROUP_SIZE = 6;   // round-robin matches per 4-team group

const PRED_KEY = 'wcviz.pred.v1';
const normalizePred = o => ({g:(o&&o.g)||{}, third:(o&&o.third)||{}, win:(o&&o.win)||{}, manual:(o&&o.manual)||{}});
function loadPred() {
  const q = _params.get('predict');
  if (q) { try { return normalizePred(JSON.parse(decodeURIComponent(escape(atob(q))))); } catch (e) {} }
  try { const o = JSON.parse(localStorage.getItem(PRED_KEY)); if (o) return normalizePred(o); } catch (e) {}
  return {g:{}, third:{}, win:{}, manual:{}};
}
let PRED = loadPred();
let predOn = false, predView = 'knockout';
function savePred() { try { localStorage.setItem(PRED_KEY, JSON.stringify(PRED)); } catch (e) {} }

const groupDecided = g => { const fx = MATCHES.filter(m => m.g === g); return fx.length === GROUP_SIZE && fx.every(m => m.s1 != null); };
// committed = what feeds the bracket: real order if the group is done, else the
// user's predicted order, else null (slot stays a placeholder — blanks are fine)
function committedOrder(g) {
  if (groupDecided(g)) return standingsFor(g).map(r => r.c);
  return PRED.g[g] || null;
}
const displayOrder = g => committedOrder(g) || standingsFor(g).map(r => r.c);

function slotTeam(m, side) {
  const tag = m[side];
  if (TEAMS[tag]) return tag;                       // reality already resolved this slot
  const p = tag.slice(1); let mm;
  if ((mm = p.match(/^W·(\w)$/)))        { const o = committedOrder(mm[1]); return o ? o[0] : null; }
  if ((mm = p.match(/^2nd·(\w)$/)))      { const o = committedOrder(mm[1]); return o ? o[1] : null; }
  if (p.startsWith('3rd·'))              { return PRED.third[m.sec] || null; }   // wildcard: user-assigned
  if ((mm = p.match(/^W Match (\d+)$/))) return winnerCode(+mm[1]);
  if ((mm = p.match(/^L Match (\d+)$/))) return loserCode(+mm[1]);
  return null;
}
function realWinner(m) {
  if (m.s1 == null) return null;
  if (m.pens) { const pp = m.pens.split(/[–—-]/).map(Number); return pp[0] > pp[1] ? slotTeam(m,'a') : slotTeam(m,'b'); }
  return m.s1 > m.s2 ? slotTeam(m,'a') : m.s2 > m.s1 ? slotTeam(m,'b') : null;
}
function winnerCode(n) { const m = matchByN(n); if (!m) return null; return m.s1 != null ? realWinner(m) : (PRED.win[n] || null); }
function loserCode(n)  { const m = matchByN(n); if (!m) return null; const a = slotTeam(m,'a'), b = slotTeam(m,'b'); const w = m.s1 != null ? realWinner(m) : PRED.win[n]; return !w ? null : w === a ? b : w === b ? a : null; }

function thirdSide(m) { return m.a.startsWith('?3rd·') ? 'a' : m.b.startsWith('?3rd·') ? 'b' : null; }
function thirdCandidates(m, sec) {
  const side = thirdSide(m); if (!side) return [];
  const groups = m[side].slice(5).split('/');
  const used = new Set(Object.keys(PRED.third).filter(k => k !== sec).map(k => PRED.third[k]));
  const out = [];
  for (const g of groups) { const o = committedOrder(g); const t = o && o[2]; if (t && !used.has(t) && out.indexOf(t) < 0) out.push(t); }
  return out;
}
// drop picks that no longer make sense after an upstream change cascades
function prunePred() {
  let changed = true, guard = 0;
  while (changed && guard++ < 12) {
    changed = false;
    for (const n of Object.keys(PRED.win)) {
      const m = matchByN(+n), a = m && slotTeam(m,'a'), b = m && slotTeam(m,'b');
      if (!m || (PRED.win[n] !== a && PRED.win[n] !== b)) { delete PRED.win[n]; changed = true; }
    }
    for (const sec of Object.keys(PRED.third)) {
      const m = KO_MATCHES.find(x => x.sec === sec);
      if (!m || thirdCandidates(m, sec).indexOf(PRED.third[sec]) < 0) { delete PRED.third[sec]; changed = true; }
    }

// ── prediction actions ──
function predMove(g, idx, dir) {
  if (groupDecided(g)) return;
  if (!PRED.g[g]) PRED.g[g] = standingsFor(g).map(r => r.c);
  const arr = PRED.g[g], j = idx + dir;
  if (j < 0 || j >= arr.length) return;
  const t = arr[idx]; arr[idx] = arr[j]; arr[j] = t;
  PRED.manual[g] = 1;                                // hand-arranged → Auto/Random leave it alone
  prunePred(); savePred(); renderBracket();
}
function predPickWinner(n, code) {

  if (PRED.win[n] === code) delete PRED.win[n]; else PRED.win[n] = code;
  prunePred(); savePred(); renderBracket();
}
function predCycleThird(sec) {

  const seq = [null, ...thirdCandidates(m, sec)];
  let i = seq.indexOf(PRED.third[sec] || null); if (i < 0) i = 0;
  const next = seq[(i + 1) % seq.length];

}
const fyShuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// Auto: seed from current standings, randomising only genuinely-tied teams. Random: ignore
// standings entirely and shuffle. Both skip groups locked by reality or hand-arranged with ▲▼.
function predAutoFill() { for (const g of Object.keys(GROUPS)) if (!groupDecided(g) && !PRED.manual[g]) PRED.g[g] = standingsFor(g, true).map(r => r.c); savePred(); renderBracket(); }
function predRandom() { for (const g of Object.keys(GROUPS)) if (!groupDecided(g) && !PRED.manual[g]) PRED.g[g] = fyShuffle(GROUPS[g]); savePred(); renderBracket(); }
function predReset() { if (!confirm('Clear your whole bracket?')) return; PRED = {g:{}, third:{}, win:{}, manual:{}}; savePred(); renderBracket(); }
function predSetView(v) { predView = v; renderBracket(); }
function predOpen() { predOn = true; $id('bracket').classList.add('open'); $id('predBtn').classList.add('on'); renderBracket(); }
function predClose() { predOn = false; $id('bracket').classList.remove('open'); $id('predBtn').classList.remove('on'); }
function predToast(msg) { const t = document.createElement('div'); t.className = 'brkToast'; t.textContent = msg; $id('bracket').appendChild(t); setTimeout(() => t.remove(), 2200); }
function predShare() {
  const url = location.origin + location.pathname + '?predict=' + btoa(unescape(encodeURIComponent(JSON.stringify(PRED))));
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => predToast('🔗 Bracket link copied!'), () => predToast('Copy failed'));
  else predToast('Clipboard unavailable');
}

// ── prediction scoring vs reality ──
function predScore() {
  let c = 0, t = 0;
  for (const m of KO_MATCHES) { if (m.s1 == null) continue; const pick = PRED.win[m.n]; if (pick) { t++; if (pick === realWinner(m)) c++; } }
  for (const g of Object.keys(GROUPS)) {
    if (!groupDecided(g) || !PRED.g[g]) continue;
    const real = standingsFor(g).map(r => r.c);
    for (let i = 0; i < 3; i++) { t++; if (PRED.g[g][i] === real[i]) c++; }
  }
  return {c, t};
}

// ── rendering ──
function renderBracket() {
  const sc = predScore(), champ = winnerCode(104);
  const champHTML = champ ? `🏆 <b style="color:var(--gold)">${TEAMS[champ][0]}</b>` : '🏆 Pick a champion';
  $id('bracketInner').innerHTML = `
    <div class="brkHead">
      <h2><span class="pc">🔮 Bracket Predictor</span></h2>
      <span class="brkScore">${champHTML}</span>
      ${sc.t ? `<span class="brkScore">✓ <b>${sc.c}</b>/${sc.t} correct</span>` : ''}
      <div class="brkTabs">
        <button class="${predView === 'groups' ? 'on' : ''}" onclick="predSetView('groups')">Groups</button>
        <button class="${predView === 'knockout' ? 'on' : ''}" onclick="predSetView('knockout')">Knockout</button>
      </div>
      <div class="brkAct">
        <button onclick="predAutoFill()" title="Seed undecided groups from current standings (ties broken at random); keeps groups you set by hand">⚡ Auto</button>
        <button onclick="predRandom()" title="Shuffle undecided groups at random, ignoring standings; keeps groups you set by hand">🎲 Random</button>
        <button onclick="predShare()">🔗 Share</button>
        <button onclick="predReset()" title="Clear bracket">↺</button>
        <button class="x" onclick="predClose()" title="Close (Esc)">✕</button>
      </div>
    </div>
    <div class="brkBody">${predView === 'groups' ? renderGroupsView() : renderKnockoutView()}</div>`;
}
function renderGroupsView() {
  let h = `<p class="brkHint">Use <b>▲▼</b> to set each group's finish. Top 2 advance (<b style="color:var(--pitch)">green</b>); the 3rd (<b style="color:var(--orange)">amber</b>) can grab a wildcard spot — assign those in <b>Knockout</b>. Finished groups lock to the real result.</p><div class="grpGrid">`;
  for (const g of Object.keys(GROUPS)) {
    const dec = groupDecided(g), ord = displayOrder(g), committed = !!committedOrder(g);
    const real = dec ? ord : null;
    const tag = dec ? '<span class="lkTag fin">FINAL</span>'
      : committed ? '<span class="lkTag pick">PICKED</span>'
      : '<span class="lkTag live">LIVE</span>';
    h += `<div class="grpCard"><h3>Group ${g}${tag}</h3>`;
    ord.forEach((c, i) => {
      const cls = i < 2 ? 'q' : i === 2 ? 'wc' : '';
      let vb = '';
      if (dec && PRED.g[g] && i < 3) { const ok = PRED.g[g][i] === real[i]; vb = `<span class="vb ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</span>`; }
      h += `<div class="grpRow ${cls}${dec ? ' locked' : ''}">
        <span class="rk">${i + 1}</span>
        <img src="${flagURL(c)}" alt=""><span class="gn">${TEAMS[c][0]}</span>${vb}
        <span class="mv">
          <button onclick="predMove('${g}',${i},-1)" ${i === 0 ? 'disabled' : ''}>▲</button>
          <button onclick="predMove('${g}',${i},1)" ${i === ord.length - 1 ? 'disabled' : ''}>▼</button>
        </span></div>`;
    });
    h += `</div>`;
  }
  return h + `</div>`;
}
function slotHTML(m, side) {
  const code = slotTeam(m, side), decided = m.s1 != null, isThird = m[side].startsWith('?3rd·');
  let cls = 'koSlot', label, attr = '';
  if (code) {
    label = `<img src="${flagURL(code)}" alt=""> ${code}`;
    if (!decided && PRED.win[m.n] === code) cls += ' win';
    if (decided && realWinner(m) === code) cls += ' realwin';
    if (!decided) attr = `data-pick onclick="predPickWinner(${m.n},'${code}')"`;
  } else if (isThird) {
    cls += ' third'; label = `<span class="ph">🃏 3rd ${m[side].slice(5)} ▾</span>`;
    if (!decided) attr = `onclick="predCycleThird('${m.sec}')"`;
  } else {
    const tm = teamMeta(m[side]); label = `<span class="ph">${tm.label || tm.badge}</span>`;
  }
  return `<div class="${cls}" ${attr}>${label}</div>`;
}
function koMatchHTML(m) {
  const decided = m.s1 != null;
  let badge = '';
  if (decided && PRED.win[m.n]) { const ok = PRED.win[m.n] === realWinner(m); badge = `<span class="vbadge ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</span>`; }
  const sc = decided ? `<span class="koSc">${m.s1}–${m.s2}${m.pens ? ` (${m.pens}p)` : ''}</span>` : '';
  return `<div class="koMatch${decided ? ' decided' : ''}">
    <div class="koMn">${ROUND_SHORT[m.r] || m.r} · M${m.n} ${sc}${badge}</div>
    ${slotHTML(m,'a')}${slotHTML(m,'b')}</div>`;
}
function renderKnockoutView() {
  const rounds = [['Round of 32','Round of 32'],['Round of 16','Round of 16'],['Quarterfinal','Quarterfinals'],['Semifinal','Semifinals'],['Final','Final'],['Third Place','3rd Place']];
  let h = `<p class="brkHint">Tap a team to send them through — winners flow to the next round. Tap an amber <b style="color:var(--orange)">🃏 3rd ▾</b> slot to cycle eligible wildcards. Blanks stay as placeholders; real results lock and score your picks ✓/✗. Tip: hit <b>⚡ Auto</b> to seed groups, then tweak.</p><div class="koWrap">`;
  for (const [r, title] of rounds) {
    const ms = KO_MATCHES.filter(m => m.r === r).sort((a, b) => a.n - b.n);
    if (!ms.length) continue;
    h += `<div class="koCol"><h4>${title}</h4>${ms.map(koMatchHTML).join('')}</div>`;
  }
  return h + `</div>`;
}
$id('predBtn').onclick = () => predOn ? predClose() : predOpen();

// ── help / tutorial ────────────────────────────────────────────────────────
let helpOn = false;
const HELP_KEY = 'wcviz.seenHelp.v1';
const HELP_ROWS = [
  ['🗺️','<b>The map.</b> Every marker is a stadium. Idle ones show a dot &amp; next-match countdown; active ones pulse with the day’s match count; the Final bounces a 🏆. Click any marker for its fixtures &amp; capacity.'],
  ['📅','<b>Pick a day.</b> Tap a date on the timeline, use <span class="k">◀</span> <span class="k">▶</span>, or the <span class="k">←</span> <span class="k">→</span> keys. Chip colors mark the round — group → R32 → R16 → … → Final.'],
  ['▶️','<b>Play the tournament.</b> Hit <span class="k">▶</span> (or <span class="k">space</span>) for a day-by-day light show that flashes stadiums in kickoff order.'],
  ['🪧','<b>Match cards.</b> The side panel lists the day’s games by stadium, with kickoff in <b>both</b> stadium-local and your own time zone. Live games glow red; finished ones dim and show the score.'],
  ['⭐','<b>Follow a team.</b> Pick one to star their match days, trace their <b>travel route</b> city-to-city, and gold-light every stadium they play in.'],
  ['🏆','<b>Road to the Final.</b> While following a team, toggle their hypothetical path to MetLife Stadium — as group winners or as runners-up.'],
  ['📊','<b>Groups.</b> Click any <b>Group X</b> label for live standings (FIFA tiebreakers) and all six fixtures. Tap a team there to follow it.'],
  ['🔴','<b>Live scores.</b> During matches the scores, clock and standings update on their own — no refresh needed.'],
  ['🔊','<b>Goal sounds.</b> Toggle 🔊 in the timeline bar for a fanfare when a goal goes in (off by default).'],
  ['🔮','<b>Bracket predictor.</b> Open 🔮 to order the groups, tap winners through the knockouts, assign third-place wildcards, and share your bracket. Real results lock in and grade your picks ✓/✗.'],
  ['🔗','<b>Share the view.</b> The URL remembers your day, followed team and bracket — copy it to share exactly what you’re looking at.'],
];
function renderHelp() {
  $id('help').firstElementChild.innerHTML = `
    <div class="hh"><h2><span class="pc">👋 How to use the Match Day Map</span></h2>
      <button class="hx" onclick="helpClose()" title="Close (Esc)">✕</button></div>
    <div class="helpBody">${HELP_ROWS.map(([i, t]) => `<div class="helpRow"><div class="hi">${i}</div><div class="ht">${t}</div></div>`).join('')}</div>
    <div class="helpFoot"><button onclick="helpClose()">Got it ⚽</button></div>`;
}
function helpOpen() { helpOn = true; renderHelp(); $id('help').classList.add('open'); }
function helpClose() { helpOn = false; $id('help').classList.remove('open'); try { localStorage.setItem(HELP_KEY, '1'); } catch (e) {} }
$id('helpBtn').onclick = () => helpOn ? helpClose() : helpOpen();

// ── go! ──────────────────────────────────────────────────────────────────
let _initTeam = (_params.get('team') || '').toUpperCase();
if (!TEAMS[_initTeam] && TEAMS[SAVED.follow]) _initTeam = SAVED.follow;   // restore last followed team
if (TEAMS[_initTeam]) {
  sel.value = _initTeam;
  const _qr = _params.get('road');
  if (_qr) { roadOn = true; roadPos = _qr === '2' ? '2' : 'W'; }
  else if (SAVED.roadOn) { roadOn = true; roadPos = SAVED.roadPos === '2' ? '2' : 'W'; }
  sel.onchange();
}
$id('fab').onclick = () => $id('panel').classList.toggle('open');
$id('sheetClose').onclick = () => $id('panel').classList.remove('open');
applyFormFactor();
setDay(dayIdx, TEAMS[_initTeam] ? false : undefined);  // a team deep link keeps the journey fit
if (TEAMS[_initTeam]) buildJourney();                  // re-fit now that layout is final
renderStrip();
if (_params.get('sheet') === '1') $id('panel').classList.add('open');
const _qg = (_params.get('group') || '').toUpperCase();
if (GROUPS[_qg]) openGroup(_qg);
if (_params.get('play') === '1') startPlay();
if (_params.get('predict')) predOpen();
// first-time visitors get the tutorial once (unless a deep link is steering them somewhere)
let _seenHelp = true; try { _seenHelp = !!localStorage.getItem(HELP_KEY); } catch (e) {}
if (!_seenHelp && !_params.get('predict') && !_params.get('group') && !_params.get('play')) helpOpen();
</script>

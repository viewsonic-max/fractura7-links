<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ World Cup 26 — Match Day Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1120; --panel:rgba(13,20,38,.88); --panel-border:rgba(255,255,255,.09);
    --ink:#eef2ff; --ink-dim:#94a3c4; --pitch:#22e07c; --pitch-deep:#0ea35a;
    --gold:#ffd166; --hot:#ff5d8f; --sky:#4cc9f0; --violet:#b388ff; --orange:#ff9f43;
    --live:#ff3b5c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{font-family:'Outfit',system-ui,sans-serif; background:var(--bg); color:var(--ink);}
  #map{position:absolute; inset:0; background:#0b1120;}
  .leaflet-container{font:inherit;}

  /* ── header ─────────────────────────────── */
  #hdr{
    position:absolute; top:14px; left:14px; z-index:1000;
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter:blur(12px); border-radius:18px; padding:14px 20px 12px;
    box-shadow:0 8px 32px rgba(0,0,0,.45); width:380px; max-width:calc(100vw - 28px);
  }
  #hdr h1{
    font-size:21px; font-weight:900; letter-spacing:.5px; line-height:1.1;
    background:linear-gradient(92deg,var(--pitch) 0%,var(--sky) 45%,var(--hot) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    display:flex; align-items:center; gap:8px;
  }
  #hdr h1 .ball{font-size:24px; -webkit-text-fill-color:initial; animation:spin 9s linear infinite; display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #hdr .sub{font-size:11.5px; color:var(--ink-dim); margin-top:3px;}
  #dayTitle{font-size:26px; font-weight:800; margin-top:10px; line-height:1;}
  #dayMeta{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .chip{font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);}
  .chip.round{color:#04150c;}

  /* ── live strip ─────────────────────────── */
  #liveStrip{
    margin-top:10px; padding:7px 11px; border-radius:10px; display:none; line-height:1.5;
    background:rgba(255,59,92,.13); border:1px solid rgba(255,59,92,.4);
    font-size:11.5px; font-weight:600; cursor:pointer;
  }
  #liveStrip:hover{filter:brightness(1.2);}
  #liveStrip.next{background:rgba(76,201,240,.1); border-color:rgba(76,201,240,.3);}
  .reddot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--live);
    box-shadow:0 0 8px var(--live); margin-right:6px; animation:blink 1.2s ease infinite;}
  @keyframes blink{50%{opacity:.25}}

  /* ── journey card ───────────────────────── */
  #journey{margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.1); display:none;}
  #journey .jhead{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:800;}
  #journey .jhead img{width:22px; height:15px; border-radius:3px; object-fit:cover;}
  .jstops{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; align-items:center;}
  .jarrow{color:var(--ink-dim); font-size:10px;}
  .jstop{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:8px; cursor:pointer;
    background:rgba(34,224,124,.13); border:1px solid rgba(34,224,124,.4); transition:.12s;
  }
  .jstop.k{background:rgba(255,209,102,.12); border-color:rgba(255,209,102,.45); color:var(--gold);}
  .jstop:hover{transform:translateY(-1px); filter:brightness(1.25);}
  .jmiles{font-size:10.5px; color:var(--ink-dim); margin-top:7px;}
  #roadBtn{
    margin-top:8px; width:100%; padding:6px; border-radius:9px; cursor:pointer; transition:.15s;
    border:1px solid rgba(255,209,102,.5); background:transparent; color:var(--gold);
    font:800 11px 'Outfit',sans-serif; letter-spacing:.4px;
  }
  #roadBtn:hover{background:rgba(255,209,102,.12);}
  #roadBtn.on{background:linear-gradient(135deg,#ffe9a8,var(--gold)); color:#3a2c00;}
  .posSeg{display:flex; gap:5px; margin-top:6px;}
  .posSeg button{
    flex:1; padding:4px; border-radius:8px; border:1px solid var(--panel-border);
    background:#16203a; color:var(--ink-dim); font:700 10px 'Outfit',sans-serif; cursor:pointer;
  }
  .posSeg button.on{border-color:var(--gold); color:var(--gold);}
  .groupLink{cursor:pointer; text-decoration:underline dotted;}
  .groupLink:hover{color:var(--sky);}

  /* ── follow team ────────────────────────── */
  #follow{
    position:absolute; top:14px; right:14px; z-index:1000;
    background:var(--panel); border:1px solid var(--panel-border); backdrop-filter:blur(12px);
    border-radius:14px; padding:10px 14px; box-shadow:0 8px 32px rgba(0,0,0,.45);
    display:flex; align-items:center; gap:8px;
  }
  #follow label{font-size:12px; font-weight:600; color:var(--ink-dim); white-space:nowrap;}
  #follow select{
    background:#16203a; color:var(--ink); border:1px solid var(--panel-border);
    border-radius:9px; padding:6px 8px; font:600 13px 'Outfit',sans-serif; max-width:170px; cursor:pointer;
  }
  #followFlag{width:26px; height:19px; border-radius:3px; object-fit:cover; display:none;
    box-shadow:0 0 0 2px var(--gold);}

  /* ── side panel ─────────────────────────── */
  #panel{
    position:absolute; top:175px; left:14px; bottom:118px; width:380px; z-index:999;
    display:flex; flex-direction:column; pointer-events:none;
  }
  #panelInner{
    pointer-events:auto; overflow-y:auto; padding:4px 6px 12px 0;
    scrollbar-width:thin; scrollbar-color:#33415e transparent;
    mask-image:linear-gradient(#000 92%,transparent);
  }
  .venueHead{display:flex; align-items:center; gap:8px; margin:14px 2px 6px; cursor:pointer;}
  .venueHead:first-child{margin-top:2px;}
  .venueHead .dot{width:10px; height:10px; border-radius:50%; background:var(--pitch); box-shadow:0 0 10px var(--pitch);}
  .venueHead .vn{font-size:13px; font-weight:800; letter-spacing:.3px;}
  .venueHead .vc{font-size:11px; color:var(--ink-dim);}
  .card{
    pointer-events:auto; background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter:blur(10px); border-radius:14px; padding:10px 14px; margin-bottom:8px;
    box-shadow:0 4px 18px rgba(0,0,0,.35); cursor:pointer;
    transition:transform .15s, border-color .15s, box-shadow .15s;
    animation:pop .35s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .noanim .card{animation:none;}
  .card:hover{transform:translateX(4px) scale(1.015); border-color:var(--pitch);}
  .card.followed{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold),0 4px 22px rgba(255,209,102,.25);}
  .card.live{border-color:var(--live); box-shadow:0 0 0 1px var(--live),0 4px 24px rgba(255,59,92,.35);}
  .card.done{opacity:.55;}
  @keyframes pop{from{opacity:0; transform:translateY(14px) scale(.96)}}
  .card .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;}
  .card .ko{font-size:15px; font-weight:800; color:var(--pitch);}
  .card .ko small{font-weight:600; color:var(--ink-dim); font-size:10px; margin-left:4px;}
  .card .mn{font-size:10px; color:var(--ink-dim); font-weight:600;}
  .liveTag{display:inline-flex; align-items:center; font-size:12px; font-weight:900; color:#ff7a90;}
  .ftTag{font-size:10px; font-weight:900; color:var(--ink-dim); background:rgba(255,255,255,.09);
    padding:1px 7px; border-radius:7px; margin-left:6px; vertical-align:2px;}
  .teams{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;}
  .team{display:flex; align-items:center; gap:8px; min-width:0;}
  .team.right{flex-direction:row-reverse; text-align:right;}
  .team img{width:30px; height:21px; border-radius:4px; object-fit:cover; box-shadow:0 1px 5px rgba(0,0,0,.5); flex-shrink:0;}
  .team .tbd{
    width:30px; height:21px; border-radius:4px; flex-shrink:0; display:grid; place-items:center;
    font-size:9px; font-weight:800; background:#222e4d; color:var(--sky); border:1px dashed #3c4f7e;
  }
  .team span{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .vs{font-size:10px; font-weight:800; color:var(--ink-dim);}
  .score{text-align:center; font-size:17px; font-weight:900; color:var(--gold); line-height:1.05; white-space:nowrap;}
  .score small{display:block; font-size:8.5px; color:var(--ink-dim); font-weight:700;}
  .card .your{font-size:10.5px; color:var(--ink-dim); margin-top:6px;}
  #noGames{
    pointer-events:auto; background:var(--panel); border:1px solid var(--panel-border);
    border-radius:14px; padding:18px; text-align:center; color:var(--ink-dim); font-size:14px;
  }

  /* ── group drawer ───────────────────────── */
  #drawer{
    position:absolute; top:80px; bottom:118px; right:-380px; width:340px; z-index:1100;
    background:var(--panel); border:1px solid var(--panel-border); backdrop-filter:blur(14px);
    border-radius:18px; box-shadow:0 12px 40px rgba(0,0,0,.55); overflow:hidden;
    transition:right .28s cubic-bezier(.4,1.4,.6,1); display:flex; flex-direction:column;
  }
  #drawer.open{right:14px;}
  #drawerInner{display:flex; flex-direction:column; min-height:0;}
  .dh{display:flex; justify-content:space-between; align-items:center; padding:14px 16px 10px;}
  .dh h2{font-size:18px; font-weight:900;}
  .dh h2 b{color:var(--pitch);}
  .dx{background:none; border:none; color:var(--ink-dim); font-size:19px; cursor:pointer;}
  .dx:hover{color:var(--ink);}
  .db{overflow-y:auto; padding:0 14px 14px; scrollbar-width:thin; scrollbar-color:#33415e transparent;}
  .gteam{display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:10px; cursor:pointer;}
  .gteam:hover{background:rgba(255,255,255,.07);}
  .gteam img{width:30px; height:21px; border-radius:4px; object-fit:cover;}
  .gteam .fname{font-weight:800; font-size:14px; flex:1;}
  .gteam .fw{font-size:10px; color:var(--gold); font-weight:700; opacity:0; transition:.15s;}
  .gteam:hover .fw{opacity:1;}
  .gteam.followed .fw{opacity:1;}
  .stTbl{width:100%; border-collapse:collapse; font-size:11.5px;}
  .stTbl th{font-size:9px; font-weight:800; color:var(--ink-dim); letter-spacing:.5px; padding:3px 2px; text-align:center;}
  .stTbl th.tl, .stTbl td.tl{text-align:left;}
  .stTbl td{padding:5px 2px; text-align:center; font-weight:700; border-top:1px solid rgba(255,255,255,.06);}
  .stTbl tbody tr{cursor:pointer;}
  .stTbl tbody tr:hover{background:rgba(255,255,255,.07);}
  .stTbl td.tl{font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;}
  .stTbl td.tl img{width:21px; height:14px; border-radius:2.5px; object-fit:cover; vertical-align:-2px; margin-right:5px;}
  .stTbl td.ps{font-weight:900; color:var(--ink-dim); width:18px;}
  .stTbl tr.q td.ps{color:var(--pitch);}
  .stTbl tr.m td.ps{color:var(--orange);}
  .stTbl td.pts{font-weight:900; color:var(--gold);}
  .stTbl tr.fol td{background:rgba(255,209,102,.08);}
  .legend{font-size:9.5px; color:var(--ink-dim); margin:6px 2px 0;}
  .gfix{margin-top:10px; border-top:1px solid rgba(255,255,255,.08); padding-top:8px;}
  .gfixTitle{font-size:10px; font-weight:800; color:var(--ink-dim); letter-spacing:1px; margin:0 6px 4px;}
  .gfx{display:flex; align-items:center; gap:7px; padding:6px; border-radius:9px; cursor:pointer; font-size:12px; font-weight:700;}
  .gfx:hover{background:rgba(255,255,255,.07);}
  .gfx .gd{color:var(--pitch); font-weight:800; min-width:48px; font-size:11px;}
  .gfx img{width:20px; height:14px; border-radius:2.5px; object-fit:cover;}
  .gfx .gv{color:var(--ink-dim); margin-left:auto; font-size:10px; font-weight:600; text-align:right;}

  /* ── timeline ───────────────────────────── */
  #tl{
    position:absolute; left:14px; right:14px; bottom:14px; z-index:1000;
    background:var(--panel); border:1px solid var(--panel-border); backdrop-filter:blur(12px);
    border-radius:18px; padding:10px 12px; box-shadow:0 8px 32px rgba(0,0,0,.45);
    display:flex; align-items:center; gap:10px;
  }
  .tlBtn{
    width:42px; height:42px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    background:linear-gradient(135deg,var(--pitch),var(--pitch-deep)); color:#04150c;
    font-size:17px; display:grid; place-items:center; transition:transform .12s;
    box-shadow:0 4px 14px rgba(34,224,124,.35);
  }
  .tlBtn:hover{transform:scale(1.1);}
  .tlBtn.small{width:34px; height:34px; font-size:13px; background:#222e4d; color:var(--ink); box-shadow:none;}
  #days{display:flex; gap:6px; overflow-x:auto; scroll-behavior:smooth; padding:4px 2px; scrollbar-width:none;}
  #days::-webkit-scrollbar{display:none;}
  .day{
    flex-shrink:0; width:54px; padding:6px 0 5px; border-radius:12px; cursor:pointer;
    text-align:center; border:1px solid transparent; transition:all .15s; position:relative;
    background:rgba(255,255,255,.04);
  }
  .day:hover{background:rgba(255,255,255,.1);}
  .day .dw{font-size:9px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.8px;}
  .day .dn{font-size:18px; font-weight:800; line-height:1.15;}
  .day .dm{font-size:9px; color:var(--ink-dim); font-weight:600;}
  .day .cnt{
    margin:3px auto 0; width:fit-content; min-width:17px; padding:0 4px; border-radius:8px;
    font-size:9.5px; font-weight:800; color:#04150c; line-height:15px;
  }
  .day.active{background:rgba(34,224,124,.16); border-color:var(--pitch); transform:translateY(-2px);}
  .day.active .dn{color:var(--pitch);}
  .day .fdot{position:absolute; top:4px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 6px var(--gold); display:none;}
  .day .today{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    font-size:7.5px; font-weight:900; letter-spacing:.5px; background:var(--hot); color:#fff;
    padding:1.5px 6px; border-radius:6px; box-shadow:0 2px 8px rgba(255,93,143,.5);
  }

  /* ── clock chip (playback) ──────────────── */
  #clockChip{
    position:absolute; left:50%; bottom:122px; transform:translateX(-50%); z-index:1001;
    background:var(--panel); border:1px solid var(--gold); border-radius:999px;
    padding:8px 18px; display:none; align-items:center; gap:12px; white-space:nowrap;
    font-size:12px; font-weight:700; box-shadow:0 8px 30px rgba(0,0,0,.55);
    backdrop-filter:blur(12px); animation:chipin .25s cubic-bezier(.34,1.56,.64,1);
    max-width:calc(100vw - 60px); overflow:hidden;
  }
  @keyframes chipin{from{opacity:0; transform:translateX(-50%) translateY(10px)}}
  #clockChip .t{color:var(--gold); font-weight:900; font-size:14px;}
  #clockChip img{width:18px; height:12px; border-radius:2px; vertical-align:-1px; object-fit:cover;}
  #clockChip .sep{color:var(--ink-dim);}

  /* ── markers ────────────────────────────── */
  .stadion{position:relative;}
  .stadion .pin{
    position:absolute; inset:0; border-radius:50%; display:grid; place-items:center;
    font:800 14px 'Outfit',sans-serif; color:#04150c; transition:all .2s;
    border:2.5px solid rgba(255,255,255,.85); box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .stadion.live .pin{background:radial-gradient(circle at 30% 30%, #7dffb8, var(--pitch) 60%, var(--pitch-deep));}
  .stadion.live .ring{
    position:absolute; inset:-6px; border-radius:50%; border:2.5px solid var(--pitch);
    animation:pulse 1.8s ease-out infinite;
  }
  .stadion.live .ring.r2{animation-delay:.9s;}
  @keyframes pulse{0%{transform:scale(.7); opacity:.9} 100%{transform:scale(1.7); opacity:0}}
  .stadion.idle .pin{background:#2a3553; color:#7787ab; border-color:rgba(255,255,255,.25); font-size:9px;}
  .stadion.finale .pin{background:radial-gradient(circle at 30% 30%, #ffe9a8, var(--gold) 55%, #e0a93c); animation:bounce 1s ease infinite;}
  .stadion.finale .ring{border-color:var(--gold);}
  @keyframes bounce{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
  .stadion.hot .pin{transform:scale(1.35); border-color:var(--gold); box-shadow:0 0 24px rgba(255,209,102,.8);}
  .stadion.livenow .pin{background:radial-gradient(circle at 30% 30%, #ffb3bd, var(--live) 60%, #b01030); color:#fff;}
  .stadion.livenow .ring{border-color:var(--live);}
  .stadion.fav .pin{
    background:radial-gradient(circle at 30% 30%, #ffe9a8, var(--gold) 55%, #e0a93c);
    border-color:#fff; box-shadow:0 0 22px rgba(255,209,102,.85);
  }
  .stadion.fav .ring{border-color:var(--gold);}
  .stadion.fav .lbl{border-color:var(--gold); color:var(--gold); font-weight:800;}
  .favTag{
    position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:6px;
    display:flex; align-items:center; gap:4px; padding:2px 7px; border-radius:9px;
    background:linear-gradient(135deg,#ffe9a8,var(--gold)); color:#3a2c00;
    font:900 10px 'Outfit',sans-serif; white-space:nowrap;
    box-shadow:0 3px 12px rgba(255,209,102,.55); animation:bob 1.4s ease-in-out infinite;
  }
  .favTag img{width:19px; height:13px; border-radius:2.5px; object-fit:cover; box-shadow:0 1px 3px rgba(0,0,0,.4);}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-5px)}}
  .stadion .lbl{
    position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:7px;
    font:700 10px 'Outfit',sans-serif; color:var(--ink); white-space:nowrap;
    background:rgba(11,17,32,.8); padding:2px 8px; border-radius:8px; backdrop-filter:blur(4px);
    border:1px solid var(--panel-border); pointer-events:none;
  }
  .stadion.idle .lbl{color:#7787ab; opacity:.75;}
  .stopBadge{
    font:800 9.5px 'Outfit',sans-serif; background:rgba(34,224,124,.92); color:#04150c;
    padding:2px 7px; border-radius:8px; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.45);
    width:fit-content;
  }
  .stopBadge.k{background:linear-gradient(135deg,#ffe9a8,var(--gold)); color:#3a2c00;}
  .ballIcon{font-size:17px; filter:drop-shadow(0 2px 5px rgba(0,0,0,.65)); animation:spin 2.2s linear infinite;}

  /* ── popup ──────────────────────────────── */
  .leaflet-popup-content-wrapper{
    background:var(--panel); color:var(--ink); border-radius:14px;
    border:1px solid var(--panel-border); backdrop-filter:blur(12px);
    box-shadow:0 10px 36px rgba(0,0,0,.55);
  }
  .leaflet-popup-tip{background:#16203a;}
  .leaflet-popup-content{margin:13px 16px; font:inherit; min-width:230px;}
  .pp h3{font-size:15px; font-weight:800;}
  .pp .ppc{font-size:11px; color:var(--ink-dim); margin:1px 0 8px;}
  .pp .ppm{display:flex; align-items:center; gap:7px; padding:5px 0; border-top:1px solid rgba(255,255,255,.07); font-size:12.5px; font-weight:600;}
  .pp .ppm img{width:22px; height:15px; border-radius:3px; object-fit:cover;}
  .pp .ppm .t{color:var(--pitch); font-weight:800; min-width:62px;}
  .pp .next{font-size:12px; color:var(--ink-dim); padding-top:6px; border-top:1px solid rgba(255,255,255,.07);}
  .leaflet-popup-close-button{color:var(--ink-dim) !important;}
  .leaflet-control-attribution{background:rgba(11,17,32,.7) !important; color:#5a6a8d !important;}
  .leaflet-control-attribution a{color:#7787ab !important;}

  #confetti{position:absolute; inset:0; z-index:1500; pointer-events:none;}

  @media (max-width: 860px){
    #panel{display:none;}
    #follow{top:auto; bottom:108px; right:14px;}
    #drawer{top:14px;}
  }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="confetti"></canvas>

<div id="hdr">
  <h1><span class="ball">⚽</span> WORLD CUP 26 · MATCH DAY MAP</h1>
  <div class="sub">Canada · Mexico · United States &nbsp;|&nbsp; June 11 – July 19, 2026</div>
  <div id="dayTitle"></div>
  <div id="dayMeta"></div>
  <div id="liveStrip"></div>
  <div id="journey"></div>
</div>

<div id="follow">
  <img id="followFlag" alt="">
  <label for="teamSel">⭐ Follow:</label>
  <select id="teamSel"><option value="">— pick a team —</option></select>
</div>

<div id="panel"><div id="panelInner"></div></div>
<div id="drawer"><div id="drawerInner"></div></div>
<div id="clockChip"></div>

<div id="tl">
  <button class="tlBtn small" id="prevBtn" title="Previous day (←)">◀</button>
  <button class="tlBtn" id="playBtn" title="Play the tournament (space)">▶</button>
  <button class="tlBtn small" id="nextBtn" title="Next day (→)">▶</button>
  <div id="days"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
if (new URLSearchParams(location.search).get('debug') === '1') {
  window.onerror = (msg, src, line, col) => {
    document.body.insertAdjacentHTML('beforeend',
      `<div style="position:fixed;top:4px;left:420px;z-index:99999;background:#c00;color:#fff;font:14px monospace;padding:8px;max-width:700px">${msg} @ ${line}:${col}</div>`);
  };
}
const {teams:TEAMS, venues:VENUES, groups:GROUPS, matches:MATCHES} = window.WC;

const ROUND_COLOR = {
  'Group Stage':'#22e07c','Round of 32':'#4cc9f0','Round of 16':'#b388ff',
  'Quarterfinal':'#ff9f43','Semifinal':'#ff5d8f','Third Place':'#d9a066','Final':'#ffd166'
};
const ROUND_SHORT = {
  'Round of 32':'R32','Round of 16':'R16','Quarterfinal':'QF','Semifinal':'SF','Final':'🏆 FINAL'
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// ── helpers ──────────────────────────────────────────────────────────────
const $id = s => document.getElementById(s);
const dateObj = d => new Date(d + 'T12:00:00');
const fmt12 = t => {
  let [h, m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
};
const kickoffUTC = m => {
  const [y, mo, da] = m.d.split('-').map(Number);
  const [h, mi] = m.t.split(':').map(Number);
  return Date.UTC(y, mo - 1, da, h - m.utc, mi);
};
const yourTime = m => new Date(kickoffUTC(m)).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'});
const flagURL = code => `https://flagcdn.com/w40/${TEAMS[code][1]}.png`;
const cssId = s => s.replace(/[^a-z0-9]/gi, '');
const esc = s => s.replace(/'/g, "\\'");
const mdOf = d => d <= '2026-06-17' ? 1 : d <= '2026-06-23' ? 2 : 3;
const groupOf = code => Object.keys(GROUPS).find(g => GROUPS[g].includes(code));

function teamMeta(t) {
  if (TEAMS[t]) return {code:t, name:TEAMS[t][0], flag:flagURL(t)};
  const p = t.slice(1);
  let badge = '?', label = p, mm;
  if ((mm = p.match(/^W·(\w)$/)))        { badge = '1' + mm[1]; label = `Winner Group ${mm[1]}`; }
  else if ((mm = p.match(/^2nd·(\w)$/))) { badge = '2' + mm[1]; label = `Runner-up Group ${mm[1]}`; }
  else if ((mm = p.match(/^3rd·(.+)$/))) { badge = '3rd'; label = `3rd place ${mm[1]}`; }
  else if ((mm = p.match(/^W Match (\d+)$/))) { badge = 'W' + mm[1]; label = `Winner of Match ${mm[1]}`; }
  else if ((mm = p.match(/^L Match (\d+)$/))) { badge = 'L' + mm[1]; label = `Loser of Match ${mm[1]}`; }
  return {badge, label};
}
function teamHTML(t, right) {
  const tm = teamMeta(t);
  if (tm.code) return `<div class="team${right?' right':''}"><img src="${tm.flag}" alt=""><span>${tm.name}</span></div>`;
  return `<div class="team${right?' right':''}"><span class="tbd">${tm.badge}</span><span style="color:var(--ink-dim)">${tm.label}</span></div>`;
}
const shortHTML = t => {
  const tm = teamMeta(t);
  return tm.code ? `<img src="${tm.flag}" alt=""> ${tm.code}` : tm.badge;
};
function haversineMi(a, b) {
  const R = 3959, rad = x => x * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDur(ms) {
  const t = Math.max(0, Math.round(ms / 60000));
  const d = Math.floor(t / 1440), h = Math.floor(t % 1440 / 60), mi = t % 60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${mi}m` : `${mi}m`;
}
// live state: pre / live / ft  (live window ≈ 2h05 groups, 2h50 knockout w/ ET+pens)
const windowMs = m => (m.r === 'Group Stage' ? 125 : 170) * 60000;
const stateOf = (m, now) => now < kickoffUTC(m) ? 'pre' : now < kickoffUTC(m) + windowMs(m) ? 'live' : 'ft';

// ── day list ─────────────────────────────────────────────────────────────
const byDay = {};
MATCHES.forEach(m => (byDay[m.d] = byDay[m.d] || []).push(m));
const DAYS = Object.keys(byDay).sort();
const _now0 = new Date();
const TODAY = `${_now0.getFullYear()}-${String(_now0.getMonth()+1).padStart(2,'0')}-${String(_now0.getDate()).padStart(2,'0')}`;

function dayLabel(d) {
  const rounds = [...new Set(byDay[d].map(m => m.r))];
  if (rounds.includes('Group Stage')) return [`Group Stage · Matchday ${mdOf(d)}`, 'Group Stage'];
  if (rounds[0] === 'Final') return ['THE FINAL 🏆', 'Final'];
  return [rounds.join(' & '), rounds[0]];
}

// ── map ──────────────────────────────────────────────────────────────────
const map = L.map('map', {zoomControl:false, attributionControl:true, minZoom:3, maxZoom:12})
  .setView([37.5, -97], 4);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a> · Schedule: <a href="https://en.wikipedia.org/wiki/2026_FIFA_World_Cup">Wikipedia</a>',
  subdomains:'abcd', maxZoom:19,
}).addTo(map);

const markers = {};
for (const [name, v] of Object.entries(VENUES)) {
  const mk = L.marker([v[2], v[3]], {icon: L.divIcon({className:'', html:'', iconSize:[40,40], iconAnchor:[20,20]})}).addTo(map);
  mk.on('click', () => openVenue(name));
  markers[name] = mk;
}

function iconFor(name, dayMatches, now) {
  const v = VENUES[name];
  const n = dayMatches.length;
  const isFinal = dayMatches.some(m => m.r === 'Final');
  const isFav = follow && dayMatches.some(m => m.a === follow || m.b === follow);
  const liveNow = dayMatches.some(m => stateOf(m, now) === 'live');
  const cls = (n === 0 ? 'idle' : isFinal ? 'finale live' : 'live')
    + (liveNow ? ' livenow' : '') + (isFav ? ' fav' : '');
  const inner = n === 0 ? '·' : isFinal && !liveNow ? '🏆' : n;
  const sz = n === 0 ? 22 : 40;
  const favTag = isFav
    ? `<div class="favTag"><img src="${flagURL(follow)}" alt="">${TEAMS[follow][0].toUpperCase()} PLAYS HERE</div>`
    : '';
  return L.divIcon({
    className:'',
    html:`<div class="stadion ${cls}" id="mk-${cssId(name)}" style="width:${sz}px;height:${sz}px">
      ${n ? '<div class="ring"></div><div class="ring r2"></div>' : ''}
      <div class="pin">${inner}</div>
      ${favTag}
      <div class="lbl">${v[0]}</div></div>`,
    iconSize:[sz, sz], iconAnchor:[sz/2, sz/2],
  });
}

// ── state ────────────────────────────────────────────────────────────────
const _params = new URLSearchParams(location.search);
const _qd = _params.get('d');
let dayIdx = _qd && DAYS.includes(_qd) ? DAYS.indexOf(_qd) : Math.max(0, DAYS.indexOf(TODAY));
let follow = '';
let roadOn = false, roadPos = 'W';

// ── timeline chips ───────────────────────────────────────────────────────
const daysEl = $id('days');
DAYS.forEach((d, i) => {
  const dt = dateObj(d);
  const el = document.createElement('div');
  el.className = 'day'; el.id = 'dd' + i;
  const [, rkey] = dayLabel(d);
  el.innerHTML = `
    ${d === TODAY ? '<span class="today">TODAY</span>' : ''}
    <span class="fdot"></span>
    <div class="dw">${DOW[dt.getDay()]}</div>
    <div class="dn">${dt.getDate()}</div>
    <div class="dm">${MONTHS[dt.getMonth()]}</div>
    <div class="cnt" style="background:${ROUND_COLOR[rkey]}">${byDay[d].length}</div>`;
  el.onclick = () => { stopPlay(); setDay(i); };
  daysEl.appendChild(el);
});

// ── core render ──────────────────────────────────────────────────────────
function layoutPanel() {
  $id('panel').style.top = (14 + $id('hdr').offsetHeight + 10) + 'px';
}

function setDay(i, fly) {
  dayIdx = (i + DAYS.length) % DAYS.length;
  const d = DAYS[dayIdx];
  const dayMatches = byDay[d];
  const dt = dateObj(d);
  const [label, rkey] = dayLabel(d);

  $id('dayTitle').textContent = `${DOW[dt.getDay()]}, ${MONTHS[dt.getMonth()]} ${dt.getDate()}`;
  const cities = new Set(dayMatches.map(m => VENUES[m.v][0]));
  $id('dayMeta').innerHTML =
    `<span class="chip round" style="background:${ROUND_COLOR[rkey]}">${label}</span>
     <span class="chip">${dayMatches.length} match${dayMatches.length>1?'es':''}</span>
     <span class="chip">${cities.size} cit${cities.size>1?'ies':'y'}</span>`;

  document.querySelectorAll('.day').forEach((el, j) => el.classList.toggle('active', j === dayIdx));
  $id('dd' + dayIdx).scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

  updateMarkers(d);
  renderPanel(d, dayMatches, false);
  map.closePopup();
  if (fly !== false) fitDay(dayMatches);
  confettiToggle(rkey === 'Final');
  layoutPanel();
}

function updateMarkers(d) {
  const now = Date.now();
  for (const name of Object.keys(VENUES)) {
    const vm = byDay[d].filter(m => m.v === name);
    markers[name].setIcon(iconFor(name, vm, now));
    const isFav = follow && vm.some(m => m.a === follow || m.b === follow);
    markers[name].setZIndexOffset(isFav ? 2000 : vm.length ? 1000 : 0);
  }
}

function fitDay(dayMatches) {
  const pts = [...new Set(dayMatches.map(m => m.v))].map(n => [VENUES[n][2], VENUES[n][3]]);
  if (!pts.length) return;
  if (pts.length === 1) map.flyTo(pts[0], 6, {duration: .9});
  else map.flyToBounds(L.latLngBounds(pts).pad(.35), {duration: .9, maxZoom: 6});
}

function renderPanel(d, dayMatches, quiet) {
  const inner = $id('panelInner');
  inner.classList.toggle('noanim', !!quiet);
  if (!dayMatches.length) { inner.innerHTML = '<div id="noGames">😴 Rest day — no matches.</div>'; return; }
  const now = Date.now();
  const byVenue = {};
  dayMatches.forEach(m => (byVenue[m.v] = byVenue[m.v] || []).push(m));
  let html = '', k = 0;
  for (const [name, ms] of Object.entries(byVenue)) {
    const v = VENUES[name];
    html += `<div class="venueHead" onclick="openVenue('${esc(name)}')">
      <div class="dot" style="background:${ROUND_COLOR[ms[0].r]};box-shadow:0 0 10px ${ROUND_COLOR[ms[0].r]}"></div>
      <div><div class="vn">${name}</div><div class="vc">${v[0]} · ${v[5]} · ${v[4].toLocaleString()} seats</div></div>
    </div>`;
    for (const m of ms) {
      const fav = follow && (m.a === follow || m.b === follow);
      const st = stateOf(m, now);
      const ko = kickoffUTC(m);
      const koHtml = st === 'live'
        ? `<span class="liveTag"><span class="reddot"></span>LIVE ${m.clock || '~' + Math.min(Math.round((now - ko) / 60000), 130) + '′'}</span>
           <small>${fmt12(m.t)} local</small>`
        : `${fmt12(m.t)}<small>local (UTC${m.utc})</small>${st === 'ft' ? '<span class="ftTag">FT</span>' : ''}`;
      const yourLine = st === 'pre'
        ? `🕒 Your time: ${yourTime(m)}${ko - now < 48 * 3600000 ? ` · <b style="color:var(--sky)">⏳ kicks off in ${fmtDur(ko - now)}</b>` : ''}`
        : st === 'live'
        ? `🔴 Underway — kicked off ${fmtDur(now - ko)} ago`
        : `🕒 Was ${yourTime(m)} your time`;
      const mid = m.s1 != null
        ? `<div class="score">${m.s1}–${m.s2}${m.pens ? `<small>${m.pens} pens</small>` : m.aet ? '<small>a.e.t.</small>' : ''}</div>`
        : '<div class="vs">VS</div>';
      const groupLink = m.g
        ? `<span class="groupLink" onclick="event.stopPropagation();openGroup('${m.g}')">Group ${m.g}</span> · ` : '';
      html += `<div class="${'card' + (fav?' followed':'') + (st==='live'?' live':'') + (st==='ft'?' done':'')}" style="animation-delay:${k++*45}ms"
        onmouseenter="hotMarker('${cssId(name)}',1)" onmouseleave="hotMarker('${cssId(name)}',0)"
        onclick="openVenue('${esc(name)}')">
        <div class="top">
          <div class="ko">${koHtml}</div>
          <div class="mn">${groupLink}${m.r !== 'Group Stage' ? m.r + ' · ' : ''}Match ${m.n}</div>
        </div>
        <div class="teams">${teamHTML(m.a)}${mid}${teamHTML(m.b, true)}</div>
        <div class="your">${yourLine}</div>
      </div>`;
    }
  }
  inner.innerHTML = html;
}

function hotMarker(id, on) {
  const el = document.getElementById('mk-' + id);
  if (el) el.classList.toggle('hot', !!on);
}

function openVenue(name) {
  const v = VENUES[name];
  const d = DAYS[dayIdx];
  const ms = byDay[d].filter(m => m.v === name);
  let body;
  if (ms.length) {
    body = ms.map(m => {
      const A = teamMeta(m.a), B = teamMeta(m.b);
      return `<div class="ppm"><span class="t">${fmt12(m.t)}</span>
        ${A.flag ? `<img src="${A.flag}">` : ''}${A.name || A.label}
        <span style="color:var(--ink-dim)">v</span>
        ${B.flag ? `<img src="${B.flag}">` : ''}${B.name || B.label}
        ${m.s1 != null ? `<b style="margin-left:auto;color:var(--gold)">${m.s1}–${m.s2}${m.pens ? ` <small>(${m.pens} p)</small>` : ''}</b>` : ''}</div>`;
    }).join('');
  } else {
    const next = MATCHES.find(m => m.v === name && m.d >= d);
    const dt = next && dateObj(next.d);
    body = `<div class="next">${next
      ? `😴 No match here today.<br>Next: <b style="color:var(--pitch)">${DOW[dt.getDay()]}, ${MONTHS[dt.getMonth()]} ${dt.getDate()}</b> at ${fmt12(next.t)}`
      : 'No more matches at this venue.'}</div>`;
  }
  L.popup({offset:[0, -16]})
    .setLatLng([v[2], v[3]])
    .setContent(`<div class="pp"><h3>🏟️ ${name}</h3>
      <div class="ppc">${v[0]} · ${v[5]}, ${TEAMS[v[1]][0]} · capacity ${v[4].toLocaleString()}</div>${body}</div>`)
    .openOn(map);
  map.flyTo([v[2], v[3]], Math.max(map.getZoom(), 5.5), {duration:.7});
}

// ── journey arcs + champion's road ───────────────────────────────────────
let journeyLayer = null, ballTimer = null;

function clearJourney() {
  if (journeyLayer) { map.removeLayer(journeyLayer); journeyLayer = null; }
  if (ballTimer) { clearInterval(ballTimer); ballTimer = null; }
}
function arcPoints(a, b) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const cx = mx - dy * 0.22, cy = my + dx * 0.22;
  const pts = [];
  for (let i = 0; i <= 32; i++) {
    const t = i / 32;
    pts.push([(1-t)*(1-t)*a[0] + 2*(1-t)*t*cx + t*t*b[0],
              (1-t)*(1-t)*a[1] + 2*(1-t)*t*cy + t*t*b[1]]);
  }
  return pts;
}
// walk the bracket from a placeholder tag until the Final (or until slots
// have been resolved with real teams and the tag no longer exists)
function chainFromTag(tag) {
  let cur = MATCHES.find(m => m.a === tag || m.b === tag);
  const out = [];
  while (cur && out.length < 6) {
    out.push({v: cur.v, label: ROUND_SHORT[cur.r] || cur.r, d: cur.d});
    if (cur.r === 'Final') break;
    cur = MATCHES.find(m => (m.a === `?W Match ${cur.n}` || m.b === `?W Match ${cur.n}`) && m.r !== 'Third Place');
  }
  return out;
}
// hypothetical remaining path for a team: from group position while in groups,
// from their last actual fixture once knockout slots resolve to real teams
function roadFrom(code, pos, mine) {
  const last = mine[mine.length - 1];
  if (!last || last.r === 'Final' || last.r === 'Third Place') return [];
  if (last.r === 'Group Stage') return chainFromTag(pos === 'W' ? `?W·${groupOf(code)}` : `?2nd·${groupOf(code)}`);
  return chainFromTag(`?W Match ${last.n}`);
}

function buildJourney() {
  clearJourney();
  if (!follow) { $id('journey').style.display = 'none'; layoutPanel(); return; }
  const gm = MATCHES.filter(m => m.a === follow || m.b === follow)
    .sort((x, y) => x.d.localeCompare(y.d));
  const stops = gm.map(m => ({
    v: m.v,
    label: m.r === 'Group Stage' ? 'MD' + mdOf(m.d) : (ROUND_SHORT[m.r] || m.r),
    d: m.d, k: m.r !== 'Group Stage', hyp: false,
  }));
  const road = roadOn ? roadFrom(follow, roadPos, gm).map(s => ({...s, k: true, hyp: true})) : [];
  const all = stops.concat(road);
  const merged = [];
  for (const s of all) {
    const p = merged[merged.length - 1];
    if (p && p.v === s.v) p.label += ' · ' + s.label;
    else merged.push({...s});
  }

  journeyLayer = L.layerGroup().addTo(map);
  let miles = 0, kmiles = 0, fullPath = [];
  for (let i = 0; i < merged.length - 1; i++) {
    const A = VENUES[merged[i].v], B = VENUES[merged[i+1].v];
    const pts = arcPoints([A[2], A[3]], [B[2], B[3]]);
    const knock = merged[i+1].k, hyp = merged[i+1].hyp;
    const dmi = haversineMi([A[2], A[3]], [B[2], B[3]]);
    if (hyp) kmiles += dmi; else miles += dmi;
    L.polyline(pts, {color: knock ? '#ffd166' : '#22e07c', weight: 9, opacity: .16, interactive: false}).addTo(journeyLayer);
    L.polyline(pts, {color: knock ? '#ffd166' : '#22e07c', weight: 2.6, opacity: .95,
      dashArray: hyp ? '7 9' : null, interactive: false}).addTo(journeyLayer);
    fullPath = fullPath.concat(pts);
  }
  merged.forEach(s => {
    const V = VENUES[s.v];
    L.marker([V[2], V[3]], {
      icon: L.divIcon({className:'', html:`<div class="stopBadge${s.k?' k':''}">${s.label}</div>`, iconSize:[0,0], iconAnchor:[-13, 27]}),
      interactive: false,
    }).addTo(journeyLayer);
  });
  if (fullPath.length > 1) {
    const ball = L.marker(fullPath[0], {
      icon: L.divIcon({className:'', html:'<div class="ballIcon">⚽</div>', iconSize:[20,20], iconAnchor:[10,10]}),
      interactive: false, zIndexOffset: 3000,
    }).addTo(journeyLayer);
    let idx = 0;
    ballTimer = setInterval(() => { idx = (idx + 1) % fullPath.length; ball.setLatLng(fullPath[idx]); }, 30);
  }
  const inGroups = gm.length && gm[gm.length - 1].r === 'Group Stage';
  renderJourneyCard(stops, road, miles, kmiles, inGroups);
}

function renderJourneyCard(stops, road, miles, kmiles, inGroups) {
  const j = $id('journey');
  j.style.display = 'block';
  const g = groupOf(follow);
  const arrow = '<span class="jarrow">→</span>';
  const chip = s => `<span class="jstop${s.k?' k':''}" onclick="stopPlay();setDay(${DAYS.indexOf(s.d)})">${s.label} ${VENUES[s.v][0]}</span>`;
  j.innerHTML = `
    <div class="jhead"><img src="${flagURL(follow)}" alt=""> ${TEAMS[follow][0]}&rsquo;s journey
      <span class="groupLink" style="margin-left:auto;font-size:10.5px;color:var(--ink-dim)" onclick="openGroup('${g}')">Group ${g} →</span></div>
    <div class="jstops">${stops.map(chip).join(arrow)}</div>
    ${road.length ? `<div class="jstops">${road.map(chip).join(arrow)}</div>` : ''}
    <div class="jmiles">✈️ ${Math.round(miles).toLocaleString()} mi of scheduled travel${
      road.length ? ` · <b style="color:var(--gold)">+${Math.round(kmiles).toLocaleString()} mi road to glory</b>` : ''}</div>
    <button id="roadBtn" class="${roadOn?'on':''}" onclick="toggleRoad()">🏆 ROAD TO THE FINAL${roadOn?' · ON':''}</button>
    ${roadOn && inGroups ? `<div class="posSeg">
      <button class="${roadPos==='W'?'on':''}" onclick="setRoadPos('W')">as group winners</button>
      <button class="${roadPos==='2'?'on':''}" onclick="setRoadPos('2')">as runners-up</button>
    </div>` : ''}`;
  layoutPanel();
}
function toggleRoad() { roadOn = !roadOn; buildJourney(); }
function setRoadPos(p) { roadPos = p; buildJourney(); }

// ── follow team ──────────────────────────────────────────────────────────
const sel = $id('teamSel');
Object.entries(TEAMS).sort((a, b) => a[1][0].localeCompare(b[1][0]))
  .forEach(([code, [n]]) => sel.add(new Option(n, code)));
sel.onchange = () => {
  follow = sel.value;
  const img = $id('followFlag');
  if (follow) { img.src = flagURL(follow); img.style.display = 'block'; }
  else img.style.display = 'none';
  DAYS.forEach((d, i) => {
    const has = follow && byDay[d].some(m => m.a === follow || m.b === follow);
    document.querySelector(`#dd${i} .fdot`).style.display = has ? 'block' : 'none';
  });
  buildJourney();
  setDay(dayIdx, false);
};
function followTeam(c) {
  sel.value = c; sel.onchange();
  if ($id('drawer').classList.contains('open')) openGroup(groupOf(c));
}

// ── live engine ──────────────────────────────────────────────────────────
function renderStrip() {
  const now = Date.now();
  const strip = $id('liveStrip');
  const live = MATCHES.filter(m => stateOf(m, now) === 'live');
  strip.style.display = 'block';
  if (live.length) {
    strip.className = '';
    strip.innerHTML = live.map(m => {
      const A = teamMeta(m.a), B = teamMeta(m.b);
      return `<span class="reddot"></span><b>LIVE</b> · ${A.name || A.label}${m.s1 != null ? ` <b style="color:var(--gold)">${m.s1}–${m.s2}</b>` : ' v'} ${B.name || B.label} · ${VENUES[m.v][0]} · ${m.clock || '~' + Math.round((now - kickoffUTC(m)) / 60000) + '′'}`;
    }).join('<br>');
    strip.onclick = () => { stopPlay(); setDay(DAYS.indexOf(live[0].d)); openVenue(live[0].v); };
  } else {
    const next = MATCHES.filter(m => kickoffUTC(m) > now)
      .sort((a, b) => kickoffUTC(a) - kickoffUTC(b))[0];
    strip.className = 'next';
    if (next) {
      const A = teamMeta(next.a), B = teamMeta(next.b);
      strip.innerHTML = `⏳ Next kickoff in <b style="color:var(--sky)">${fmtDur(kickoffUTC(next) - now)}</b> — ${A.name || A.label} v ${B.name || B.label} · ${VENUES[next.v][0]}`;
      strip.onclick = () => { stopPlay(); setDay(DAYS.indexOf(next.d)); openVenue(next.v); };
    } else {
      strip.innerHTML = '🏆 Tournament complete — see you in 2030!';
      strip.onclick = null;
    }
  }
  layoutPanel();
}
setInterval(() => {
  renderStrip();
  if (!playing) {
    updateMarkers(DAYS[dayIdx]);
    renderPanel(DAYS[dayIdx], byDay[DAYS[dayIdx]], true);
  }
}, 30000);

// ── live score poller ────────────────────────────────────────────────────
// While matches are in (or just past) their live window, pull the score
// straight from the Wikipedia article every 2 minutes and update in place.
const PAGE_TITLE = src =>
  src === 'knockout' ? '2026 FIFA World Cup knockout stage' :
  src === 'final' ? '2026 FIFA World Cup final' :
  '2026 FIFA World Cup Group ' + src.slice(-1);

async function pollLiveScores() {
  const now = Date.now();
  const active = MATCHES.filter(m => {
    const ko = kickoffUTC(m);
    return now >= ko && now < ko + windowMs(m) + 45 * 60000;
  });
  if (!active.length) return;
  let changed = false;
  for (const src of [...new Set(active.map(m => m.src))]) {
    try {
      const url = 'https://en.wikipedia.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main'
        + '&formatversion=2&format=json&origin=*&titles=' + encodeURIComponent(PAGE_TITLE(src));
      const j = await (await fetch(url)).json();
      const text = j.query.pages[0].revisions[0].slots.main.content;
      for (const m of active.filter(x => x.src === src)) {
        const secRe = new RegExp('<section begin="?' + m.sec.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '"? *\\/>([\\s\\S]*?)<section end=');
        const block = (text.match(secRe) || [])[1];
        if (!block) continue;
        const field = f => (block.match(new RegExp('^\\|' + f + '=(.*)$', 'm')) || ['', ''])[1];
        const sm = field('score').match(/(\d+)\s*[–—-]\s*(\d+)/);
        if (sm && (+sm[1] !== m.s1 || +sm[2] !== m.s2)) { m.s1 = +sm[1]; m.s2 = +sm[2]; changed = true; }
        if (/^y/i.test(field('aet')) && !m.aet) { m.aet = 1; changed = true; }
        const pm = field('penaltyscore').match(/(\d+)\s*[–—-]\s*(\d+)/);
        if (pm && !m.pens) { m.pens = `${pm[1]}–${pm[2]}`; changed = true; }
      }
    } catch (e) { /* offline or API hiccup — retry next tick */ }
  }
  if (changed) {
    renderStrip();
    if (!playing) {
      updateMarkers(DAYS[dayIdx]);
      renderPanel(DAYS[dayIdx], byDay[DAYS[dayIdx]], true);
    }
  }
}
setInterval(pollLiveScores, 120000);
pollLiveScores();

// ESPN scoreboard: faster live source — real-time score + actual match clock
// (Wikipedia poller above remains authoritative for FT/aet/penalties)
async function pollESPN() {
  const now = Date.now();
  const anyActive = MATCHES.some(m => {
    const ko = kickoffUTC(m);
    return now >= ko - 10 * 60000 && now < ko + windowMs(m) + 45 * 60000;
  });
  if (!anyActive) return;
  try {
    const j = await (await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard')).json();
    let changed = false;
    for (const e of j.events || []) {
      const comp = e.competitions && e.competitions[0];
      const st = e.status && e.status.type ? e.status.type.state : '';
      if (!comp || (st !== 'in' && st !== 'post')) continue;
      const sides = comp.competitors.map(c => ({code: c.team.abbreviation, score: parseInt(c.score, 10)}));
      const evTime = Date.parse(e.date);
      const m = MATCHES.find(x => TEAMS[x.a] && TEAMS[x.b]
        && Math.abs(kickoffUTC(x) - evTime) < 3 * 3600000
        && sides.every(c => c.code === x.a || c.code === x.b));
      if (!m) continue;
      for (const c of sides) {
        if (Number.isNaN(c.score)) continue;
        if (c.code === m.a && m.s1 !== c.score) { m.s1 = c.score; changed = true; }
        if (c.code === m.b && m.s2 !== c.score) { m.s2 = c.score; changed = true; }
      }
      const clk = st === 'in' ? (e.status.displayClock || null) : null;
      if (m.clock !== clk) { m.clock = clk; changed = true; }
    }
    if (changed) {
      renderStrip();
      if (!playing) {
        updateMarkers(DAYS[dayIdx]);
        renderPanel(DAYS[dayIdx], byDay[DAYS[dayIdx]], true);
      }
    }
  } catch (err) { /* offline or API hiccup — retry next tick */ }
}
setInterval(pollESPN, 60000);
pollESPN();

// ── playback: kickoff-order light show ───────────────────────────────────
const playBtn = $id('playBtn');
let playing = false, playT = null, hotList = [];

function unhotAll() { hotList.forEach(id => hotMarker(id, 0)); hotList = []; }
function clockShow(html) {
  const c = $id('clockChip');
  if (html) { c.innerHTML = html; c.style.display = 'flex'; }
  else c.style.display = 'none';
}
function stopPlay() {
  playing = false;
  if (playT) { clearTimeout(playT); playT = null; }
  playBtn.textContent = '▶';
  unhotAll(); clockShow(null);
}
function startPlay() {
  if (playing) return stopPlay();
  playing = true;
  playBtn.textContent = '⏸';
  playDay(dayIdx);
}
function playDay(i) {
  if (!playing) return;
  setDay(i);
  const d = DAYS[i];
  const slots = {};
  byDay[d].forEach(m => { const k = kickoffUTC(m); (slots[k] = slots[k] || []).push(m); });
  const keys = Object.keys(slots).map(Number).sort((a, b) => a - b);
  let s = 0;
  const beat = () => {
    if (!playing) return;
    unhotAll();
    if (s < keys.length) {
      const ms = slots[keys[s]];
      const tLocal = new Date(keys[s]).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
      clockShow(`<span class="t">🕐 ${tLocal}</span>` + ms.map(m =>
        `<span>${shortHTML(m.a)} <span class="sep">v</span> ${shortHTML(m.b)} <span class="sep">·</span> ${VENUES[m.v][0]}</span>`
      ).join('<span class="sep">|</span>'));
      ms.forEach(m => { const id = cssId(m.v); hotMarker(id, 1); hotList.push(id); });
      s++;
      playT = setTimeout(beat, 1500);
    } else {
      clockShow(null);
      playT = setTimeout(() => { if (i >= DAYS.length - 1) stopPlay(); else playDay(i + 1); }, 650);
    }
  };
  playT = setTimeout(beat, 1100);
}
playBtn.onclick = startPlay;
$id('prevBtn').onclick = () => { stopPlay(); setDay(dayIdx - 1); };
$id('nextBtn').onclick = () => { stopPlay(); setDay(dayIdx + 1); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { stopPlay(); setDay(dayIdx - 1); }
  if (e.key === 'ArrowRight') { stopPlay(); setDay(dayIdx + 1); }
  if (e.key === ' ') { e.preventDefault(); startPlay(); }
  if (e.key === 'Escape') closeDrawer();
});

// ── group standings (computed from results) ──────────────────────────────
// FIFA criteria approximation: points → head-to-head points/GD/goals among
// tied teams → overall GD → overall goals (fair play + ranking unavailable)
function standingsFor(g) {
  const rows = {};
  GROUPS[g].forEach(c => rows[c] = {c, P:0, W:0, D:0, L:0, GF:0, GA:0, Pts:0});
  const played = MATCHES.filter(m => m.g === g && m.s1 != null);
  for (const m of played) {
    const A = rows[m.a], B = rows[m.b];
    A.P++; B.P++; A.GF += m.s1; A.GA += m.s2; B.GF += m.s2; B.GA += m.s1;
    if (m.s1 > m.s2) { A.W++; B.L++; A.Pts += 3; }
    else if (m.s1 < m.s2) { B.W++; A.L++; B.Pts += 3; }
    else { A.D++; B.D++; A.Pts++; B.Pts++; }
  }
  const list = Object.values(rows);
  list.forEach(r => r.GD = r.GF - r.GA);
  list.sort((x, y) => y.Pts - x.Pts);
  const out = [];
  let i = 0;
  while (i < list.length) {
    let j = i;
    while (j < list.length && list[j].Pts === list[i].Pts) j++;
    const tied = list.slice(i, j);
    if (tied.length > 1) {
      const codes = new Set(tied.map(t => t.c));
      const h2h = {};
      tied.forEach(t => h2h[t.c] = {Pts:0, GD:0, GF:0});
      for (const m of played) {
        if (!codes.has(m.a) || !codes.has(m.b)) continue;
        const A = h2h[m.a], B = h2h[m.b];
        A.GD += m.s1 - m.s2; B.GD += m.s2 - m.s1; A.GF += m.s1; B.GF += m.s2;
        if (m.s1 > m.s2) A.Pts += 3; else if (m.s1 < m.s2) B.Pts += 3; else { A.Pts++; B.Pts++; }
      }
      tied.sort((x, y) =>
        h2h[y.c].Pts - h2h[x.c].Pts || h2h[y.c].GD - h2h[x.c].GD || h2h[y.c].GF - h2h[x.c].GF ||
        y.GD - x.GD || y.GF - x.GF || TEAMS[x.c][0].localeCompare(TEAMS[y.c][0]));
    }
    out.push(...tied); i = j;
  }
  return out;
}

// ── group drawer ─────────────────────────────────────────────────────────
function openGroup(g) {
  const fx = MATCHES.filter(m => m.g === g);
  const anyPlayed = fx.some(m => m.s1 != null);
  const st = standingsFor(g);
  $id('drawerInner').innerHTML = `
    <div class="dh"><h2>Group <b>${g}</b></h2><button class="dx" onclick="closeDrawer()">✕</button></div>
    <div class="db">
      <table class="stTbl">
        <thead><tr><th></th><th class="tl">TEAM</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>PTS</th></tr></thead>
        <tbody>${st.map((r, i) => `
          <tr class="${i < 2 ? 'q' : i === 2 ? 'm' : ''}${follow === r.c ? ' fol' : ''}" onclick="followTeam('${r.c}')" title="Click to follow">
            <td class="ps">${i + 1}</td>
            <td class="tl"><img src="${flagURL(r.c)}" alt="">${TEAMS[r.c][0]}</td>
            <td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td>
            <td>${r.GD > 0 ? '+' : ''}${r.GD}</td><td class="pts">${r.Pts}</td>
          </tr>`).join('')}</tbody>
      </table>
      <div class="legend">${anyPlayed ? 'top two advance · 3rd place may advance (8 best of 12) · click a team to follow'
        : 'no results yet — table fills in as matches finish · click a team to follow'}</div>
      <div class="gfix"><div class="gfixTitle">FIXTURES</div>
      ${fx.map(m => {
        const dt = dateObj(m.d);
        return `<div class="gfx" onclick="stopPlay();setDay(${DAYS.indexOf(m.d)});openVenue('${esc(m.v)}')">
          <span class="gd">${MONTHS[dt.getMonth()]} ${dt.getDate()}</span>
          <img src="${flagURL(m.a)}" alt="">${m.a}
          ${m.s1 != null ? `<b style="color:var(--gold)">${m.s1}–${m.s2}</b>` : '<span style="color:var(--ink-dim)">v</span>'}
          ${m.b}<img src="${flagURL(m.b)}" alt="">
          <span class="gv">${m.s1 != null ? 'FT' : fmt12(m.t)}<br>${VENUES[m.v][0]}</span></div>`;
      }).join('')}
      </div>
    </div>`;
  $id('drawer').classList.add('open');
}
function closeDrawer() { $id('drawer').classList.remove('open'); }

// ── confetti (final day) ─────────────────────────────────────────────────
const cv = $id('confetti'), cx = cv.getContext('2d');
let confOn = false, parts = [];
function confettiToggle(on) {
  if (on === confOn) return;
  confOn = on;
  if (on) {
    cv.width = innerWidth; cv.height = innerHeight;
    parts = Array.from({length: 140}, () => ({
      x: Math.random() * cv.width, y: -Math.random() * cv.height,
      w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
      vy: 1.4 + Math.random() * 2.4, vx: Math.random() * 1.4 - .7,
      rot: Math.random() * Math.PI, vr: Math.random() * .12 - .06,
      c: ['#ffd166', '#22e07c', '#ff5d8f', '#4cc9f0', '#ffffff', '#b388ff'][Math.random() * 6 | 0],
    }));
    requestAnimationFrame(confTick);
  }
}
function confTick() {
  if (!confOn) { cx.clearRect(0, 0, cv.width, cv.height); return; }
  cx.clearRect(0, 0, cv.width, cv.height);
  for (const p of parts) {
    p.y += p.vy; p.x += p.vx + Math.sin(p.y * .02); p.rot += p.vr;
    if (p.y > cv.height + 20) { p.y = -20; p.x = Math.random() * cv.width; }
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  }
  requestAnimationFrame(confTick);
}
addEventListener('resize', () => { layoutPanel(); if (confOn) { cv.width = innerWidth; cv.height = innerHeight; } });

// ── go! ──────────────────────────────────────────────────────────────────
const _qt = (_params.get('team') || '').toUpperCase();
if (TEAMS[_qt]) {
  sel.value = _qt;
  const _qr = _params.get('road');
  if (_qr) { roadOn = true; roadPos = _qr === '2' ? '2' : 'W'; }
  sel.onchange();
}
setDay(dayIdx);
renderStrip();
const _qg = (_params.get('group') || '').toUpperCase();
if (GROUPS[_qg]) openGroup(_qg);
if (_params.get('play') === '1') startPlay();
</script>
